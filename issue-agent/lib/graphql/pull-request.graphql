query ($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      closingIssuesReferences(first: 20) {
        nodes { number }
      }
      reviewThreads(last: 100) {
        nodes {
          id
          isResolved
          path
          line
          comments(last: 50) {
            nodes {
              body
              createdAt
              author {
                __typename
                login
                ... on User { databaseId }
                ... on Bot { databaseId }
              }
            }
          }
        }
      }
    }
  }
}
