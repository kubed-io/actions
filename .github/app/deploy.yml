name: 🚀 Deploy

# A merge to main ships: kubectl up, through kubed-io/actions.
on:
  push:
    branches:
    - main

jobs:
  deploy:
    name: Deploy
    uses: kubed-io/actions/.github/workflows/kubectl.yml@main
    with:
      cmd: up
    secrets: inherit
    permissions:
      contents: read
      id-token: write
