name: Issue Agent · Hand-back
description: >
  A family turn's hand-back to n8n: a sub-issue's `report`, a parent's `actions`, or the
  number make-sub-issue filed (`filed`, so n8n starts its first turn), POSTed to
  the agent-flow callback (AGENT_FLOW_CALLBACK_URL on the runner, AGENT_FLOW_N8N_TOKEN in the
  job's env). Nothing is sent when the field is empty, and n8n's answer never fails the job.
  A `body` made elsewhere, a review's `verdict` (review-route), is sent as it is instead.

inputs:
  output:
    description: The turn's role output, as JSON (issue-agent's `output`).
    required: false
    default: ""
  kin:
    description: >
      issue-route's `kin`: `sub-issue` sends `report`, `parent` sends `actions`; `filed` sends the
      filed sub-issue `number` under `parent`; anything else sends nothing.
    required: false
    default: ""
  number:
    description: The issue the turn was on; for `filed`, the sub-issue filed.
    required: false
    default: ""
  parent:
    description: The family's top issue.
    required: false
    default: ""
  body:
    description: >
      A body to send as it is, as JSON with its `type`, in place of one from `output`; set but
      empty, nothing is sent.
    required: false
    default: ""

outputs:
  sent:
    description: "The body's `type` (`report`, `actions`, `verdict`, `filed`) when n8n took it; empty otherwise."
    value: ${{ steps.post.outputs.sent }}

runs:
  using: composite
  steps:

  - name: Hand Back
    id: post
    uses: actions/github-script@v9
    env:
      OUTPUT: ${{ inputs.output }}
      KIN: ${{ inputs.kin }}
      NUMBER: ${{ inputs.number }}
      PARENT: ${{ inputs.parent }}
      BODY: ${{ inputs.body }}
    with:
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/../lib/handback.js`).run({ context, core });
