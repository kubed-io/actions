name: 🛠️ Agent · Pull Request

# Plan, then code, on a PR opened from an issue (head `issue-*`). Until `plan approved`,
# Dr K's comments and reviews are plan turns, and each turn's spec and plan are committed
# to the branch (docs/). The label starts the code. While the PR is a draft,
# each code run does one plan task and its changes are committed; that push, relayed by
# n8n (Agent flow · intake), wakes the next run. The run that finishes the plan says `done`: its
# commit carries `Agent: done`, which wakes nothing, and the PR is marked ready, which
# starts the checks and, after them, agent-review.yml. Failed checks and a review asking
# for changes both come back as the `agent-code` dispatch, the code agent's one event
# interface: {pull_request, reason, run_id or review_id}.
#
# On a change Dr K asked Copilot to review (his own request, usually on the draft), Copilot
# is the reviewer: each code turn asks it for the new head, and a code turn waits for its
# review of the head before starting, so it answers the checks and Copilot together.
# Copilot's reviews, relayed by n8n, go to agent-review.yml, whose Route reads them.
#
# The job gates name ids, not variables: a job's `if` is decided before any runner, so
# only GitHub's own event data can vouch for the sender. 4399427 is Dr K, 235398881 the
# kubed-io App's bot (n8n's relay, the agents' dispatches), 41898282 github-actions[bot]
# (the review agent's dispatch). Who else counts inside a run comes from the claude
# runner's env.
#
# A repo calls this from its agent-pr.yml, on the `agent-code` and `agent-route` dispatches.
# The jobs on the claude runner run for a dispatch only: the runner group lists this file, and
# a dispatch always runs the caller on the default branch, never a branch's copy. A repo's own
# setup for the code agent, past Python, is its `.github/actions/agent-setup` action.

on:
  workflow_call:
    inputs:
      wiki:
        description: >-
          The wiki submodule's path: `docs` when the specs live in the wiki, which then
          lands first and docs/ is its pointer; `wiki` when docs/ is in the repo; empty for
          none.
        type: string
        required: true

permissions: {}

jobs:

  route:
    name: Route
    if: >-
      (github.event_name == 'repository_dispatch' && github.event.action == 'agent-route' &&
        github.event.sender.id == 235398881) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'agent-code' &&
        (github.event.sender.id == 4399427 ||
          github.event.sender.id == 41898282 ||
          github.event.sender.id == 235398881))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
      # a relayed comment's author and the approval's labeler are read back from GitHub
      issues: read
    outputs:
      stage: ${{ steps.route.outputs.stage }}
      number: ${{ steps.route.outputs.number }}
      head: ${{ steps.route.outputs.head }}
      prompt: ${{ steps.route.outputs.prompt }}
      prompt_when: ${{ steps.route.outputs.prompt_when }}
      takeover: ${{ steps.route.outputs.takeover }}
      run_id: ${{ steps.route.outputs.run_id }}
      review_id: ${{ steps.route.outputs.review_id }}
    steps:

    # Before `plan approved`: Dr K's comments and reviews are plan turns. After it: his
    # comments and reviews, the label, an `agent-code` dispatch, and a push to the draft by
    # the agent or Dr K are code turns; a push whose commit says `Agent: done` is not. A
    # review by Copilot is `copilot`, at any stage. Anything else is nothing. Each turn's
    # words are a kb prompt.
    - name: Route
      id: route
      uses: kubed-io/actions/pr-route@main
      with:
        # the kubed-runner plugin's superpowers server: its prompts' slash names
        prompts: /mcp__plugin_kubed-runner_superpowers__superpowers_
        owner: "4399427"
        app: "235398881"
        copilot: "175728472"

  # Copilot's review is the verdict on its change, or its cancelled review of a draft: the
  # review route reads it. On the App's token: a caller grants this workflow no contents write
  copilot:
    name: Copilot's Review
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'copilot'
    runs-on: ubuntu-26.04
    permissions: {}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write

    - name: Over to the Review Route
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        NUMBER: ${{ needs.route.outputs.number }}
        REVIEW_ID: ${{ needs.route.outputs.review_id }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=agent-review \
          -F "client_payload[pull_request]=${NUMBER}" -f "client_payload[reason]=copilot" \
          -F "client_payload[review_id]=${REVIEW_ID}"

  plan:
    name: Plan
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'plan'
    runs-on: claude
    environment: claude
    # one agent job per PR at a time; the approval label cancels the one running
    concurrency:
      group: agent-pr-${{ needs.route.outputs.number }}
      cancel-in-progress: ${{ needs.route.outputs.takeover == 'true' }}
    timeout-minutes: 30
    permissions:
      issues: read
      pull-requests: read
      contents: read
    env:
      # the agent-flow channel's token: n8n's messages reach the running turn
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    # a queued turn routes again as it starts: the change may be finished or moved on (spec §12.8)
    - name: Still a Turn
      id: still
      uses: kubed-io/actions/pr-route@main
      with:
        # the kubed-runner plugin's superpowers server: its prompts' slash names
        prompts: /mcp__plugin_kubed-runner_superpowers__superpowers_
        owner: "4399427"
        app: "235398881"
        copilot: "175728472"

    - name: App Token
      if: steps.still.outputs.stage == 'plan'
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    - name: Checkout
      if: steps.still.outputs.stage == 'plan'
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.route.outputs.head }}
        submodules: true
        persist-credentials: false

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      if: steps.still.outputs.stage == 'plan'
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      if: steps.still.outputs.stage == 'plan'
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        live: true

    - name: Plan Agent
      if: steps.still.outputs.stage == 'plan'
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        settings: ${{ env.CLAUDE_AGENTS }}/plan/settings.json
        schema: ${{ env.CLAUDE_AGENTS }}/plan/schema.json
        allowed_tools: Read,Glob,Grep,Write,Edit
        disallowed_tools: Bash,NotebookEdit
        header: "📄 Plan · [{{ output.plan_path }}]({{ link:output.plan_path }})"
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,kubed-io[bot]
        session_key: pr-${{ needs.route.outputs.number }}
        live_messages: true

    # the spec and plan live under docs/, one signed commit
    - name: Commit the Plan
      id: commit
      if: steps.still.outputs.stage == 'plan' && fromJSON(steps.agent.outputs.output || '{}').commit_message
      # a refused commit is said in the answer; the job fails after it
      continue-on-error: true
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ needs.route.outputs.head }}
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        files: docs
        # the wiki has no commit API: pushed with git, its pointer in this commit
        submodules: ${{ inputs.wiki }}
        author: ${{ steps.app.outputs.app-slug }}
        # what a failed commit leaves is kept in the scratchpad for the next turn
        keep_to: .issue/scratch/uncommitted

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        comment_id: ${{ steps.agent.outputs.comment_id }}
        append: ${{ steps.commit.outputs.summary }}

    - name: The Commit Failed
      if: steps.commit.outcome == 'failure'
      run: echo "::error::the commit failed; its answer says why" && exit 1

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  code:
    name: Code
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'code'
    runs-on: claude
    environment: claude
    concurrency:
      group: agent-pr-${{ needs.route.outputs.number }}
      cancel-in-progress: ${{ needs.route.outputs.takeover == 'true' }}
    # the App token below lasts an hour; a turn past it cannot land (selenium-flow#104)
    timeout-minutes: 120
    permissions:
      issues: read
      contents: read
      # the checks report, an artifact of pr.yml's run
      actions: read
      # pr-checks: the alerts and the annotations
      pull-requests: read
      checks: read
      security-events: read
    env:
      # the agent-flow channel's token: n8n's messages reach the running turn
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    # a queued turn routes again as it starts: the change may be finished or moved on (spec §12.8)
    - name: Still a Turn
      id: still
      uses: kubed-io/actions/pr-route@main
      with:
        # the kubed-runner plugin's superpowers server: its prompts' slash names
        prompts: /mcp__plugin_kubed-runner_superpowers__superpowers_
        owner: "4399427"
        app: "235398881"
        copilot: "175728472"

    # Copilot's change: its review of the head, when it was asked for one, is part of this
    # turn; waiting before the App token, which lasts an hour
    - name: Wait for Copilot
      if: steps.still.outputs.stage == 'code'
      uses: kubed-io/actions/review-route/copilot@main
      with:
        github_token: ${{ github.token }}
        step: wait
        number: ${{ needs.route.outputs.number }}
        owner: "4399427"

    - name: App Token
      if: steps.still.outputs.stage == 'code'
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write
        # pr-checks/rerun
        permission-actions: write

    - name: Checkout
      if: steps.still.outputs.stage == 'code'
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.route.outputs.head }}
        fetch-depth: 0
        submodules: true
        persist-credentials: false

    # CI tests the floor and the newest; the agent has both (python3.11), 3.14 the default
    - name: Setup Python
      if: steps.still.outputs.stage == 'code'
      uses: actions/setup-python@v7
      with:
        python-version: |
          3.11
          3.14

    - name: Install
      if: steps.still.outputs.stage == 'code'
      run: pip install --editable .[test,build]

    # the repo's own setup (selenium-flow: Node and the UI's packages), from the checkout
    - name: Agent Setup
      if: steps.still.outputs.stage == 'code' && hashFiles('.github/actions/agent-setup/action.yml') != ''
      uses: ./.github/actions/agent-setup

    # after the agents' checkout, into the gitignored scratch dir the agent reads
    - name: Checks Report
      if: steps.still.outputs.stage == 'code' && (needs.route.outputs.run_id != '')
      uses: actions/download-artifact@v8
      with:
        name: checks-report
        run-id: ${{ needs.route.outputs.run_id }}
        github-token: ${{ github.token }}
        path: .issue/checks

    # what the checks found: the PR's code scanning alerts and the head's annotations
    - name: PR Checks
      if: steps.still.outputs.stage == 'code'
      uses: kubed-io/actions/pr-checks@main
      with:
        number: ${{ needs.route.outputs.number }}

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      if: steps.still.outputs.stage == 'code'
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      if: steps.still.outputs.stage == 'code'
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        live: true
        prompt: ${{ needs.route.outputs.prompt_when == 'always' && needs.route.outputs.prompt || '' }}

    - name: Code Agent
      if: steps.still.outputs.stage == 'code'
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        settings: ${{ env.CLAUDE_AGENTS }}/code/settings.json
        schema: ${{ env.CLAUDE_AGENTS }}/code/schema.json
        allowed_tools: Read,Edit,Write,Glob,Grep,Bash,Agent
        prompt: ${{ needs.route.outputs.prompt }}
        prompt_when: ${{ needs.route.outputs.prompt_when }}
        # the plan approved: the planning drafts give way to the code
        compact: >-
          ${{ needs.route.outputs.takeover == 'true' && 'The plan is approved and the code
          starts now. Keep Dr K''s rulings and why, what was settled and what was rejected,
          and where the spec and plan live. Drop the drafting of the spec and plan: their
          files are the record.' || '' }}
        max_runs: 40
        # the review agent posts as github-actions[bot]: its threads count
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,kubed-io[bot],41898282,github-actions
        session_key: pr-${{ needs.route.outputs.number }}
        live_messages: true

    # the turn's work, one signed commit. The run that finishes the plan says `Agent: done` on
    # it, so its push wakes nothing
    - name: Commit the Turn
      id: commit
      if: steps.still.outputs.stage == 'code' && fromJSON(steps.agent.outputs.output || '{}').commit_message
      # a refused commit is said in the answer; the job fails after it
      continue-on-error: true
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ needs.route.outputs.head }}
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        trailers: "${{ fromJSON(steps.agent.outputs.output).done == true && 'Agent: done' || '' }}"
        # the App cannot write workflow files, and one in the commit refuses all of it
        ignore: .github/workflows/**
        # the wiki has no commit API: pushed with git, its pointer in this commit
        submodules: ${{ inputs.wiki }}
        author: ${{ steps.app.outputs.app-slug }}
        # what a failed commit leaves is kept in the scratchpad for the next turn
        keep_to: .issue/scratch/uncommitted

    # done: out of draft, after the commit and on the App's token, so ready_for_review starts
    # the checks and the review once, on the final commit
    - name: Mark Ready
      if: >-
        steps.still.outputs.stage == 'code' && steps.commit.outcome != 'failure' &&
        fromJSON(steps.agent.outputs.output || '{}').done == true
      uses: kubed-io/actions/git/pr@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ needs.route.outputs.head }}
        draft: false

    # Copilot's change: the head the turn committed is Copilot's to review, alongside its checks
    - name: Ask Copilot
      if: steps.still.outputs.stage == 'code'
      uses: kubed-io/actions/review-route/copilot@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        step: ask
        number: ${{ needs.route.outputs.number }}
        owner: "4399427"

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        comment_id: ${{ steps.agent.outputs.comment_id }}
        append: ${{ steps.commit.outputs.summary }}

    - name: The Commit Failed
      if: steps.commit.outcome == 'failure'
      run: echo "::error::the commit failed; its answer says why" && exit 1

    # the agent judged the failed checks not this branch's: their failed jobs run once more;
    # green brings the review, red again is Dr K's call
    - name: Re-run the Checks
      if: steps.still.outputs.stage == 'code' && needs.route.outputs.run_id != '' && fromJSON(steps.agent.outputs.output || '{}').rerun == true
      uses: kubed-io/actions/pr-checks/rerun@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        run_id: ${{ needs.route.outputs.run_id }}

    # the plan built: the fix rounds that follow carry its summary, not every step of it
    - name: Compact the Session
      if: >-
        steps.still.outputs.stage == 'code' && steps.agent.outputs.session_id != '' &&
        fromJSON(steps.agent.outputs.output || '{}').done == true
      # a session that could not be compacted is still a finished task
      continue-on-error: true
      env:
        SESSION_ID: ${{ steps.agent.outputs.session_id }}
        CLAUDE: ${{ env.PATH_TO_CLAUDE_CODE_EXECUTABLE || 'claude' }}
        INSTRUCTIONS: >-
          The plan is built. Keep Dr K's rulings, what each task built and where, the
          deviations recorded, and anything a review fix needs. Drop the step-by-step
          implementation: the code, the plan and your notes are the record.
      run: '"$CLAUDE" -p "/compact $INSTRUCTIONS" --resume "$SESSION_ID" --strict-mcp-config --output-format json > /dev/null'

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}