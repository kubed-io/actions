name: 🔀 PR

# The PR's head built and planned, both in one summary.
on:
  pull_request:
    branches:
    - main

# a new push to the PR replaces the run still going
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    uses: kubed-io/actions/.github/workflows/plan.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
