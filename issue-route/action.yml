name: Issue Route
description: >
  Decides what an event on a work item is for the agents: a spec turn, the hand-off to a
  plan, the make-sub-issue turn or nothing, the kb prompt the turn starts with and the session
  it thinks in. Reads the issue only; runs no Claude. Answers n8n's `agent-issue` dispatch, its
  family wake-ups (`family_event`) among them, re-reading who caused it.

inputs:
  github_token:
    description: A token that may read issues.
    required: false
    default: ${{ github.token }}
  actions_token:
    description: >-
      A token that may read actions, for the look for the family's make job in flight; empty
      skips it, and a label takes over.
    required: false
    default: ""
  owner:
    description: The owner's user id; their comments and labels are turns.
    required: true
  app:
    description: The App's bot's user id; its own comments are never turns.
    required: true
  prompts:
    description: What the kb prompts' names follow, as slash commands.
    required: false
    default: /mcp__superpowers__superpowers_

outputs:
  stage:
    description: "`spec`, `handoff`, `file` (the make-sub-issue turn, on the parent's `file` action) or `none`."
    value: ${{ steps.route.outputs.stage }}
  why:
    description: Why the stage is `none`, when the issue was read.
    value: ${{ steps.route.outputs.why }}
  number:
    description: The issue.
    value: ${{ steps.route.outputs.number }}
  family:
    description: The family's top issue, the issue itself when it has no parent; its session and queue are the turn's.
    value: ${{ steps.route.outputs.family }}
  change:
    description: >-
      On a hand-off: `sub` for a sub-issue's change into its family's branch, `parent` for a
      parent's change from issue-<P> to the default branch (Dr K's `spec approved` on it, or the
      parent's `open_pr` as n8n's `family-pr`), `own` otherwise.
    value: ${{ steps.route.outputs.change }}
  plan:
    description: >-
      `true` when the change starts with a plan turn: a Feature's always, a Bug's only with
      `needs plan`.
    value: ${{ steps.route.outputs.plan }}
  title:
    description: Its title.
    value: ${{ steps.route.outputs.title }}
  label:
    description: The label just added; empty for a comment.
    value: ${{ steps.route.outputs.label }}
  role:
    description: "The turn's agent: `spec` for a Feature, `debug` for a Bug."
    value: ${{ steps.route.outputs.role }}
  writes:
    description: "`true` when a Feature has the `spec` label: a branch, and files that are committed."
    value: ${{ steps.route.outputs.writes }}
  prompt:
    description: >-
      The turn's prompt: `spec-draft` for the `spec` label; on a sub-issue's first turn,
      `sub-issue`, or `debug-report` for a Bug; `debug-report` for a Bug's `agent` label; a
      family wake-up's own (`sub-issue-closed`, `sub-issue-reported`, `parent-message`, and
      `make-sub-issue <type>: <title>` with an `Ask: ` line for `sub-issue-file`), a sub-issue's
      first turn's opening for `sub-issue-start` and any first `parent-message`; else empty.
    value: ${{ steps.route.outputs.prompt }}
  prompt_when:
    description: >-
      `lead` for `debug-report`, `sub-issue` and the family wake-ups' spec turns, which lead the
      thread's unseen posts into the turn; `always` for `sub-issue-file`; else `quiet`.
    value: ${{ steps.route.outputs.prompt_when }}
  session:
    description: >-
      The session the turn thinks in: `issue-<family>/<number>` on a sub-issue, else
      `issue-<number>`.
    value: ${{ steps.route.outputs.session }}
  fork_from:
    description: "On a sub-issue, `issue-<family>`: a new session starts as a fork of the parent's. Else empty."
    value: ${{ steps.route.outputs.fork_from }}
  kin:
    description: "`sub-issue`, `parent` (it has sub-issues) or `alone`."
    value: ${{ steps.route.outputs.kin }}
  item_type:
    description: On the `file` stage, the new sub-issue's type, `Feature` or `Bug`.
    value: ${{ steps.route.outputs.item_type }}
  open_sub_issues:
    description: >-
      On the parent's hand-off (`change: parent`), its `agent` sub-issues still open, as JSON
      [{number, title}], for the family change's body (R-SM30); empty otherwise.
    value: ${{ steps.route.outputs.open_sub_issues }}
  opt_in_label:
    description: >-
      The label the turn's gate checks, `agent`; the literal `none` for a family wake-up admitted through
      R-SM29 (an unlabelled parent opted in by its `agent` sub-issue), which has no label to check (a literal, so a missing output never reads as it).
    value: ${{ steps.route.outputs.opt_in_label }}
  takeover:
    description: >-
      `true` for a label, which takes the issue over; a comment waits its turn, and so does a
      label while its family's `Make the Sub-issue · #<family>` job is in flight.
    value: ${{ steps.route.outputs.takeover }}

runs:
  using: composite
  steps:

  - name: Route
    id: route
    uses: actions/github-script@v9
    env:
      OWNER_ID: ${{ inputs.owner }}
      APP_ID: ${{ inputs.app }}
      PROMPTS: ${{ inputs.prompts }}
      ACTIONS_TOKEN: ${{ inputs.actions_token }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/route.js`).run({ github, context, core, getOctokit });
