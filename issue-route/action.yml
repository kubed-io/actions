name: Issue Route
description: >
  Decides what an event on a work item is for the agents: a spec turn, the hand-off to a
  plan, or nothing, and the kb prompt the turn starts with. Reads the issue only; runs no
  Claude. Answers the native `issues` and `issue_comment` events, where the job's `if` gates
  the sender, and n8n's `agent-issue` dispatch, re-reading who caused it.

inputs:
  github_token:
    description: A token that may read issues.
    required: false
    default: ${{ github.token }}
  owner:
    description: The owner's user id; their comments and labels are turns.
    required: true
  app:
    description: The App's bot's user id; its own comments are never turns.
    required: true
  prompts:
    description: What the kb prompts' names follow, as slash commands.
    required: false
    default: /mcp__superpowers__superpowers_

outputs:
  stage:
    description: "`spec`, `handoff` or `none`."
    value: ${{ steps.route.outputs.stage }}
  number:
    description: The issue.
    value: ${{ steps.route.outputs.number }}
  title:
    description: Its title.
    value: ${{ steps.route.outputs.title }}
  label:
    description: The label just added; empty for a comment.
    value: ${{ steps.route.outputs.label }}
  writes:
    description: "`true` when the issue has the `spec` label: a branch, and files that are committed."
    value: ${{ steps.route.outputs.writes }}
  prompt:
    description: The turn's prompt, `spec-draft` for the `spec` label; else empty.
    value: ${{ steps.route.outputs.prompt }}
  takeover:
    description: "`true` for a label, which takes the issue over; a comment waits its turn."
    value: ${{ steps.route.outputs.takeover }}

runs:
  using: composite
  steps:

  - name: Route
    id: route
    uses: actions/github-script@v9
    env:
      OWNER_ID: ${{ inputs.owner }}
      APP_ID: ${{ inputs.app }}
      PROMPTS: ${{ inputs.prompts }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/route.js`).run({ github, context, core });
