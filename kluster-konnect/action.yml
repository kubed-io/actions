name: Kluster Konnect
description: >
  Authenticates to GCP via OIDC, configures kubeconfig, and connects to
  OpenVPN. Detects in-cluster SA credentials automatically — on a
  self-hosted runner inside the cluster, kubeconfig is built from the
  mounted service account token and GCP auth, VPN, and kubeconfig fetch
  are all skipped.
inputs:
  workload_identity_provider:
    description: GCP Workload Identity Federation provider resource name
    required: true
  project:
    description: GCP project ID
    required: true
  service_account:
    description: GCP service account name (not full email)
    required: false
    default: github
  kubeconfig_secret:
    description: GCP Secret Manager secret name for kubeconfig
    required: false
    default: github-kubeconfig
  vpn_secret:
    description: GCP Secret Manager secret name for VPN credentials
    required: false
    default: github-openvpn
runs:
  using: composite
  steps:

  # --- Kubeconfig ---

  - name: Check for in-cluster credentials
    id: cluster
    shell: bash
    run: |
      SA_TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token
      if [ -f "$SA_TOKEN" ]; then
        echo "in_cluster=true" >> $GITHUB_OUTPUT
        cat <<EOF > "$RUNNER_TEMP/kubeconfig"
      apiVersion: v1
      kind: Config
      clusters:
      - name: in-cluster
        cluster:
          server: https://kubernetes.default.svc
          certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      users:
      - name: in-cluster-user
        user:
          tokenFile: $SA_TOKEN
      contexts:
      - name: in-cluster
        context:
          cluster: in-cluster
          user: in-cluster-user
          namespace: $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
      current-context: in-cluster
      EOF
        echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> $GITHUB_ENV
      else
        echo "in_cluster=false" >> $GITHUB_OUTPUT
      fi

  - name: Authenticate to GCP
    if: steps.cluster.outputs.in_cluster != 'true'
    uses: google-github-actions/auth@v3
    with:
      workload_identity_provider: ${{ inputs.workload_identity_provider }}
      service_account: ${{ inputs.service_account }}@${{ inputs.project }}.iam.gserviceaccount.com

  - name: Get kubeconfig from GCP
    id: kube_secret
    if: steps.cluster.outputs.in_cluster != 'true'
    uses: google-github-actions/get-secretmanager-secrets@v3
    with:
      secrets: |-
        kubeconfig:${{ inputs.project }}/${{ inputs.kubeconfig_secret }}

  - name: Write kubeconfig
    if: steps.cluster.outputs.in_cluster != 'true'
    shell: bash
    env:
      KUBECONFIG_DATA: ${{ steps.kube_secret.outputs.kubeconfig }}
    run: |
      echo "$KUBECONFIG_DATA" > "$RUNNER_TEMP/kubeconfig"
      chmod 600 "$RUNNER_TEMP/kubeconfig"
      echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> $GITHUB_ENV

  # --- OpenVPN ---

  - name: Get VPN credentials
    id: vpn_secret
    if: steps.cluster.outputs.in_cluster != 'true'
    uses: google-github-actions/get-secretmanager-secrets@v3
    with:
      secrets: |-
        openvpn:${{ inputs.project }}/${{ inputs.vpn_secret }}

  - name: Parse VPN credentials
    id: vpn
    if: steps.cluster.outputs.in_cluster != 'true'
    shell: bash
    env:
      SECRET: ${{ steps.vpn_secret.outputs.openvpn }}
    run: |
      echo "username=$(echo "$SECRET" | jq -r '.username')" >> $GITHUB_OUTPUT
      echo "password=$(echo "$SECRET" | jq -r '.password')" >> $GITHUB_OUTPUT
      echo "$SECRET" | jq -r '.profile' > "$RUNNER_TEMP/profile.ovpn"

  - name: Install OpenVPN
    if: steps.cluster.outputs.in_cluster != 'true'
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get install -y openvpn openvpn-systemd-resolved

  - name: Connect to VPN
    if: steps.cluster.outputs.in_cluster != 'true'
    uses: kota65535/github-openvpn-connect-action@v2
    with:
      config_file: ${{ runner.temp }}/profile.ovpn
      username: ${{ steps.vpn.outputs.username }}
      password: ${{ steps.vpn.outputs.password }}
