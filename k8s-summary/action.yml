name: K8s Summary
description: |
  Kubernetes resources and their diffs as markdown, written to the step summary. Give it one
  file, or a list of sections for several in one summary. Each is shown by its `type`:

  `yaml` (manifests: multi-document YAML or a kubectl List, YAML or JSON) as an accordion per
  kind and another per resource; `names` (one resource a line: apply or up output, or `get -o
  name`) as the count of each verb or grouped by kind; `diff` (kubectl diff or plan) as the
  counts and a diff per resource; `text` as is, in `lang`; `auto` picks from the content.

inputs:
  title:
    description: The summary's heading; empty for none.
    required: false
  file:
    description: One section's file. Its other fields are the inputs below; `sections` follow it.
    required: false
  content:
    description: One section's text in place of `file`, such as a step output.
    required: false
  type:
    description: yaml, names, diff, text or auto, for `file` or `content`.
    required: false
    default: auto
  lang:
    description: The highlighting of a text block (json, shell, …).
    required: false
  section-title:
    description: The heading over the `file` or `content` section.
    required: false
  error-file:
    description: "`file`'s command's stderr, shown when it failed."
    required: false
  outcome:
    description: "`file`'s command step's outcome; anything but success leads with the error."
    required: false
    default: success
  sections:
    description: |
      A YAML list of sections, one `key: value` per line (or the same as JSON). The keys are
      title, file, type, lang, error_file and outcome.
    required: false
  write:
    description: false to leave the step summary alone and only output the markdown.
    required: false
    default: "true"

outputs:
  markdown_file:
    description: The markdown, for a comment or another summary.
    value: ${{ steps.summary.outputs.markdown_file }}

runs:
  using: composite
  steps:

  - name: Summary
    id: summary
    uses: actions/github-script@v9
    env:
      TITLE: ${{ inputs.title }}
      FILE: ${{ inputs.file }}
      CONTENT: ${{ inputs.content }}
      TYPE: ${{ inputs.type }}
      LANG_HINT: ${{ inputs.lang }}
      SECTION_TITLE: ${{ inputs.section-title }}
      ERROR_FILE: ${{ inputs.error-file }}
      OUTCOME: ${{ inputs.outcome }}
      SECTIONS: ${{ inputs.sections }}
      WRITE: ${{ inputs.write }}
      SUMMARY_JS: ${{ github.action_path }}/lib/summary.js
    with:
      script: |
        await require(process.env.SUMMARY_JS).run({ core });
