name: Review Route · Copilot
description: >
  The code job's steps on a change the owner asked Copilot to review. `wait`, before a code
  turn: holds until Copilot's review of the head is in, when it was asked for one, so the
  turn answers the checks and Copilot together. `ask`, after a code turn: asks Copilot to
  review the new head, alongside its checks. Both do nothing on a draft, or on a change
  Copilot was never opted into. Runs no Claude.

inputs:
  github_token:
    description: >
      A token that may read pull requests and issues; `ask` also requests reviewers
      (pull requests write). The App's token or GITHUB_TOKEN both start Copilot's review.
    required: true
  step:
    description: wait or ask.
    required: true
  number:
    description: The pull request.
    required: true
  owner:
    description: The user id whose own request for Copilot opts a change in.
    required: true
  timeout_minutes:
    description: How long `wait` holds for Copilot's review.
    required: false
    default: "20"

runs:
  using: composite
  steps:

  - name: Copilot
    uses: actions/github-script@v9
    env:
      STEP: ${{ inputs.step }}
      NUMBER: ${{ inputs.number }}
      OWNER: ${{ inputs.owner }}
      TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/../lib/copilot.js`).run({ github, context, core });
