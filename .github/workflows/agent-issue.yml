name: 🧭 Agent · Issue

# The issue is where the spec is made. On an `enhancement` issue, Dr K's `agent` label opts
# it in, and every comment from Dr K is the next turn: the agent researches, brainstorms,
# and keeps its notes at the bottom of the issue. With the `spec` label it also gets the
# branch issue-<N>, writes its draft spec there (docs/) and it is committed every
# turn. `spec approved` opens the draft PR from that branch, or from a new one with an
# empty commit, and starts the plan on it.
#
# On a Bug the debug agent reports instead, and `spec approved` hands the report to a fix:
# the PR opens labelled `bug` and `plan approved`, and the code starts on it at once. Only
# with `needs plan`, which the debug agent adds for a nasty bug, does a plan come first.
#
# n8n decides when this runs: it drops the noise and sends what is a turn as an
# `agent-issue` dispatch, a pointer the route job reads back from GitHub (spec §8.4).
#
# A family runs itself (spec 2026-11-24): a sub-issue thinks in a session of its own,
# issue-<family>/<number>, forked from the parent's issue-<family>, and hands back with
# `report`; the parent's turns end in `actions` and keep `open_questions`. n8n carries them
# out and wakes the next turn with an `agent-issue` dispatch whose `family_event` says why:
# `sub-issue-closed`, `sub-issue-reported`, `parent-message` and `sub-issue-start` (a filed
# sub-issue's first turn: make-sub-issue hands n8n the number) are spec turns, `sub-issue-file`
# the make-sub-issue turn, and `family-pr` (the parent's `open_pr`) the hand-off of the family's
# change from issue-<family> to the default branch, opened ready while sub-issues may still be
# open, or refreshed when it is open (R-SM30). Dr K's `spec approved` on a parent is the same.
#
# An upstream epic carries its downstream projects along (spec 2026-11-24 upstream releases). A
# downstream issue carries the epic's marker; its turns (`kin` `downstream`, woken by
# `upstream-start` and `upstream-message`) report to the epic as `upstream-report`, and so does
# its PR's plan turn, saying the plan is ready. Its PR's body carries the marker too. The epic's
# turn on such a report is `downstream-reported`. The family's change carries the parent's
# `release:*` label, and the parent is labelled `epic` when its first sub-issue is filed.
#
# The job gates name ids, not variables: a job's `if` is decided before any runner, so
# only GitHub's own event data can vouch for the sender. 4399427 is Dr K, 235398881 the
# kubed-io App (n8n's dispatches). Who else counts inside a run comes from the claude
# runner's env.
#
# A repo calls this from its agent-issue.yml, on the `agent-issue` dispatch. The jobs on the
# claude runner run for a dispatch only: the runner group lists this file, and a dispatch
# always runs the caller on the default branch, never a branch's copy.

on:
  workflow_call:
    inputs:
      wiki:
        description: >-
          The wiki submodule's path: `docs` when the specs live in the wiki, which then
          lands first and docs/ is its pointer; `wiki` when docs/ is in the repo; empty for
          none.
        type: string
        required: true

permissions: {}

jobs:

  # what the event is for: a spec turn, the hand-off, or nothing, read back from GitHub
  route:
    name: Route
    if: >-
      github.event_name == 'repository_dispatch' && github.event.action == 'agent-issue' &&
      github.event.sender.id == 235398881
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: read
    outputs:
      stage: ${{ steps.route.outputs.stage }}
      number: ${{ steps.route.outputs.number }}
      family: ${{ steps.route.outputs.family }}
      change: ${{ steps.route.outputs.change }}
      plan: ${{ steps.route.outputs.plan }}
      label: ${{ steps.route.outputs.label }}
      writes: ${{ steps.route.outputs.writes }}
      role: ${{ steps.route.outputs.role }}
      prompt: ${{ steps.route.outputs.prompt }}
      prompt_when: ${{ steps.route.outputs.prompt_when }}
      takeover: ${{ steps.route.outputs.takeover }}
      title: ${{ steps.route.outputs.title }}
      session: ${{ steps.route.outputs.session }}
      fork_from: ${{ steps.route.outputs.fork_from }}
      kin: ${{ steps.route.outputs.kin }}
      item_type: ${{ steps.route.outputs.item_type }}
      opt_in_label: ${{ steps.route.outputs.opt_in_label }}
      open_sub_issues: ${{ steps.route.outputs.open_sub_issues }}
      upstream: ${{ steps.route.outputs.upstream }}
      release_label: ${{ steps.route.outputs.release_label }}
    steps:

    # a label waits for the family's make job, which the router looks for among the runs with
    # this; a failed mint leaves the label's takeover as it was (R-L3)
    - name: App Token
      id: app
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-actions: read

    - name: Route
      id: route
      uses: kubed-io/actions/issue-route@main
      with:
        actions_token: ${{ steps.app.outputs.token }}
        # the kubed-runner plugin's superpowers server: its prompts' slash names
        prompts: /mcp__plugin_kubed-runner_superpowers__superpowers_
        owner: "4399427"
        app: "235398881"

  spec:
    name: Spec
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'spec'
    runs-on: claude
    environment: claude
    # one turn at a time in a family (an issue and its sub-issues): Dr K's comments queue, in
    # order; a label takes the family over, unless a sub-issue is being filed in it (R-L3).
    # GitHub cancels by the incoming job's setting, so the router decides
    concurrency:
      group: agent-issue-${{ needs.route.outputs.family }}
      cancel-in-progress: ${{ needs.route.outputs.takeover == 'true' }}
      queue: ${{ needs.route.outputs.takeover == 'true' && 'single' || 'max' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    # the commit the turn made, for the family's PRs (family-prs)
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    env:
      # the `spec` label gives the agent a branch, and files that are committed
      WRITES: ${{ needs.route.outputs.writes }}
      BRANCH: issue-${{ needs.route.outputs.number }}
      # a sub-issue's branch is cut from its family's, and its wiki branch from the family's
      # wiki pin, so it starts with its siblings' specs (R-B2, R-B12; quick-mcp #31)
      FAMILY_BRANCH: ${{ needs.route.outputs.kin == 'sub-issue' && format('issue-{0}', needs.route.outputs.family) || '' }}
      # the agent-flow channel's token: n8n's messages reach the running turn
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-issues: write

    # the family's branch, made from the default branch by whichever job needs it first (R-B1)
    - name: Family Branch
      if: env.WRITES == 'true' && env.FAMILY_BRANCH != ''
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.FAMILY_BRANCH }}
        issue: ${{ needs.route.outputs.family }}

    # found when it exists; a sub-issue's new one starts from the family's branch
    - name: Branch
      if: env.WRITES == 'true'
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        base: ${{ env.FAMILY_BRANCH }}
        issue: ${{ needs.route.outputs.number }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ env.WRITES == 'true' && env.BRANCH || '' }}
        submodules: true
        persist-credentials: false

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        live: true
        prompt: ${{ needs.route.outputs.prompt_when == 'always' && needs.route.outputs.prompt || '' }}

    # the role files, from the repo this workflow lives in at the commit it runs from; moved out
    # of the workspace so the agent has nothing of them to commit
    - name: Role Files
      uses: actions/checkout@v7
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .agent-flow
        sparse-checkout: .github/roles
        persist-credentials: false

    - name: Role Files Out of the Tree
      run: |
        mv .agent-flow "$RUNNER_TEMP/agent-flow"
        echo "AGENT_ROLES=$RUNNER_TEMP/agent-flow/.github/roles" >> "$GITHUB_ENV"

    - name: Spec Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        # a Feature's turn is the spec agent's, a Bug's the debug agent's
        # a turn that writes the spec (the `spec` label) runs as the spec-draft role, with the spec role's outputs
        settings: ${{ env.AGENT_ROLES }}/${{ env.WRITES == 'true' && 'spec-draft' || needs.route.outputs.role }}/settings.json
        schema: ${{ env.AGENT_ROLES }}/${{ needs.route.outputs.role }}/schema.json
        # n8n's dispatch makes the App the run's actor: Claude starts only for an allowed bot,
        # by login; the gate and the thread trust it by its bot's id
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,${{ steps.app.outputs.app-slug }}[bot]
        # the route's `none` (R-SM29, an unlabelled parent) is no label to gate on; anything else, `agent`
        opt_in_label: ${{ needs.route.outputs.opt_in_label || 'agent' }}
        # a label's turn is a kb prompt (superpowers library)
        prompt: ${{ needs.route.outputs.prompt }}
        prompt_when: ${{ needs.route.outputs.prompt_when }}
        # a sub-issue's own session, its first turn a fork of the parent's (R-SM12, R-SM13);
        # the parent's, and an issue's alone, issue-<number>
        session_key: ${{ needs.route.outputs.session }}
        fork_from: ${{ needs.route.outputs.fork_from }}
        live_messages: true

    # the draft spec lives under docs/, one signed commit
    - name: Commit the Spec
      id: commit
      if: env.WRITES == 'true' && fromJSON(steps.agent.outputs.output || '{}').commit_message
      # a refused commit is said in the answer; the job fails after it
      continue-on-error: true
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        files: docs
        # the wiki has no commit API: pushed with git, its pointer in this commit
        submodules: ${{ inputs.wiki }}
        # a sub-issue's first wiki commit starts its wiki branch at the family's pin, even on a
        # branch cut before it joined; one that exists is never moved
        submodule_base: ${{ env.FAMILY_BRANCH }}
        author: ${{ steps.app.outputs.app-slug }}
        # what a failed commit leaves is kept in the scratchpad for the next turn
        keep_to: .issue/scratch/uncommitted

    # the debug agent judged the fix nasty enough for a plan: the label says so on the issue,
    # and Dr K may take it off. The agent adds it, never removes it
    - name: Needs a Plan
      if: needs.route.outputs.role == 'debug' && fromJSON(steps.agent.outputs.output || '{}').plan == true
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        NUMBER: ${{ needs.route.outputs.number }}
      run: gh api "repos/${GITHUB_REPOSITORY}/issues/${NUMBER}/labels" -f "labels[]=needs plan" --silent

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        comment_id: ${{ steps.agent.outputs.comment_id }}
        append: ${{ steps.commit.outputs.summary }}

    # a sub-issue hands back to its parent with `report` (a Feature's or a Bug's); a parent's
    # turn ends in `actions`; a downstream issue's `report` goes to its epic (R-UR9). n8n posts
    # the reports and carries out the actions (R-SM17, R-SM21); its answer never fails the turn.
    # A turn whose commit failed hands nothing back: it fails
    - name: Hand Back
      if: >-
        steps.commit.outcome != 'failure' && (
        needs.route.outputs.kin == 'sub-issue' && fromJSON(steps.agent.outputs.output || '{}').report ||
        needs.route.outputs.kin == 'downstream' && fromJSON(steps.agent.outputs.output || '{}').report ||
        needs.route.outputs.kin == 'parent' && fromJSON(steps.agent.outputs.output || '{}').actions[0])
      continue-on-error: true
      uses: kubed-io/actions/issue-agent/handback@main
      with:
        output: ${{ steps.agent.outputs.output }}
        kin: ${{ needs.route.outputs.kin }}
        number: ${{ needs.route.outputs.number }}
        parent: ${{ needs.route.outputs.family }}
        upstream: ${{ needs.route.outputs.upstream }}

    # the parent's open questions, kept on it and on the family's pull request to main when
    # that is open (R-SM22a), with a token of their own: the turn's never writes pull requests
    - name: App Token for the Open Questions
      id: questions
      if: >-
        steps.commit.outcome != 'failure' && needs.route.outputs.kin == 'parent' &&
        toJSON(fromJSON(steps.agent.outputs.output || '{}').open_questions) != 'null'
      continue-on-error: true
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-issues: write
        permission-pull-requests: write

    - name: Open Questions
      if: steps.commit.outcome != 'failure' && steps.questions.outputs.token != ''
      continue-on-error: true
      uses: kubed-io/actions/issue-agent/questions@main
      with:
        github_token: ${{ steps.questions.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        output: ${{ steps.agent.outputs.output }}

    - name: The Commit Failed
      if: steps.commit.outcome == 'failure'
      run: echo "::error::the commit failed; its answer says why" && exit 1

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  # The family's branch moved: a sub-issue's change merged into it (n8n's `sub-issue-closed`
  # wake-up follows every such merge, R-SM10), or the parent's turn committed the family's
  # design there. Its open sub-issue PRs are brought up to date, as the repo's push workflow
  # does main's after a merge: a PR left behind conflicts on the docs pointer, and one whose
  # base brought a workflow file is told a person must merge it (quick-mcp #32). After the
  # parent's turn, so one run covers both; always(), so a takeover that cancels that turn still
  # passes on the merge it was woken for. Not on the claude runner: no agent runs here
  family-prs:
    name: Family PRs Up to Date
    needs: [route, spec]
    if: >-
      github.event_name == 'repository_dispatch' && always() &&
        needs.route.outputs.stage == 'spec' && needs.route.outputs.kin == 'parent' &&
        (github.event.client_payload.family_event == 'sub-issue-closed' || needs.spec.outputs.sha != '')
    runs-on: ubuntu-26.04
    concurrency:
      group: pr-update-issue-${{ needs.route.outputs.family }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    steps:

    # any checkout will do: the update fetches the base and each PR's head itself
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Bring the Family's PRs Up to Date
      uses: kubed-io/actions/pr-update@main
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        base: issue-${{ needs.route.outputs.family }}

  handoff:
    name: Hand Off
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'handoff'
    runs-on: claude
    environment: claude
    # it touches no session, so it runs in a lock of its own, never in the family's; the
    # family's change waits in the family's group, behind the parent's turn that asked for it
    # (its open questions land first), and never cancels a turn (R-SM30)
    concurrency:
      group: >-
        ${{ needs.route.outputs.change == 'parent' && format('agent-issue-{0}', needs.route.outputs.family) ||
        format('agent-handoff-{0}', needs.route.outputs.number) }}
      cancel-in-progress: false
      queue: ${{ needs.route.outputs.change == 'parent' && 'max' || 'single' }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: issue-${{ needs.route.outputs.number }}
      DEFAULT: ${{ github.event.repository.default_branch }}
      # a sub-issue's change goes into its family's branch; any other into the default branch
      BASE: ${{ needs.route.outputs.change == 'sub' && format('issue-{0}', needs.route.outputs.family) || github.event.repository.default_branch }}
      CHANGE: ${{ needs.route.outputs.change }}
      # a Bug's change is a fix: labelled `bug`, and with no plan turn unless it needs one
      FIX: ${{ needs.route.outputs.role == 'debug' }}
      PLAN: ${{ needs.route.outputs.plan }}
    outputs:
      pull_request: ${{ steps.pr.outputs.number }}
      branch: ${{ env.BRANCH }}
      change: ${{ env.CHANGE }}
      plan: ${{ env.PLAN }}
      # a downstream change's epic and issue, for its plan's hand-back (R-UR9)
      upstream: ${{ needs.route.outputs.upstream }}
      number: ${{ needs.route.outputs.number }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    # a sub-issue's family branch: made from the default branch by whichever hand-off needs it
    # first, and kept fresh from it
    - name: Family Branch
      if: env.CHANGE == 'sub'
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BASE }}
        issue: ${{ needs.route.outputs.family }}

    - name: Family Fresh from the Default Branch
      if: env.CHANGE == 'sub'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        [ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEFAULT}...${BASE}" --jq .behind_by)" = 0 ] && exit 0
        gh api "repos/${GITHUB_REPOSITORY}/merges" -f base="$BASE" -f head="$DEFAULT" \
          -f commit_message="Merge ${DEFAULT} into ${BASE}" --silent \
          || echo "::warning::${DEFAULT} could not be merged into ${BASE}; the family branch stays as it is"

    # found when the `spec` label made it; made from the base, linked to the issue, when not
    - name: Branch
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        base: ${{ env.BASE }}
        issue: ${{ needs.route.outputs.number }}

    # the plan starts from the base as it is today. When docs/ is the wiki, a spec branch
    # holds only wiki pointer commits, so it starts over there and the commit below points
    # docs at the wiki, which has the spec; merging would conflict on that pointer. Anything
    # else on the branch gets the base merged in.
    - name: Fresh from the Base
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        DOCS_WIKI: ${{ inputs.wiki == 'docs' }}
      run: |
        compare="repos/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}"
        [ "$(gh api "$compare" --jq .behind_by)" = 0 ] && exit 0
        if [ "$DOCS_WIKI" = true ] && [ "$(gh api "$compare" --jq '[.files[].filename] | unique | join(",")')" = docs ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BASE}" --jq .sha)" -F force=true --silent
        elif ! gh api "repos/${GITHUB_REPOSITORY}/merges" -f base="$BRANCH" -f head="$BASE" \
            -f commit_message="Merge ${BASE} into ${BRANCH}" --silent; then
          echo "::warning::${BASE} could not be merged into ${BRANCH}; the plan starts from the branch as it is"
        fi

    # GitHub opens no PR on a branch with nothing beyond its base
    - name: Ahead of the Base
      id: ahead
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: echo "by=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}" --jq .ahead_by)" >> "$GITHUB_OUTPUT"

    - name: Checkout
      if: steps.ahead.outputs.by == '0'
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BRANCH }}
        submodules: ${{ inputs.wiki == 'docs' }}
        persist-credentials: false

    # the wiki's head has every spec pushed so far, this issue's among them. A sub-issue's
    # change stays at its family's pin, where the branch now starts: the wiki's master has
    # none of the family's specs, and its own wiki branch would start there (quick-mcp #31)
    - name: Point at the Wiki
      if: steps.ahead.outputs.by == '0' && inputs.wiki == 'docs' && env.CHANGE != 'sub'
      run: git submodule update --remote docs

    - name: Start Commit
      if: steps.ahead.outputs.by == '0'
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        message: "Start #${{ needs.route.outputs.number }}"
        files: docs
        allow_empty: true

    # A parent's change is the family's work, already planned, coded and reviewed in its
    # sub-issues' changes: it opens ready, with `plan approved` from the App (which wakes no
    # code turn), so its checks run and the review agent reviews it whole. It may open while
    # sub-issues are still open, and one already open is found and left as it is, but ready
    # (R-SM30; R-B8a's draft rule is gone). It carries the parent's one `release:*` label, which
    # the merge releases at (R-UR1). A sub-issue's change merges into the family's branch, where
    # `Closes` closes nothing: the merge's close is by hand. A downstream change (`upstream`) is
    # `own`, so a draft, and its body ends in the epic's marker (R-UR7).
    - name: Pull Request
      id: pr
      uses: kubed-io/actions/git/pr@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        base: ${{ env.BASE }}
        title: ${{ needs.route.outputs.title }}
        draft: ${{ env.CHANGE != 'parent' }}
        # the agents' PR: the label wakes the review agent, and switches the agents off. A
        # fix with no plan is approved already: Dr K approved its report
        labels: >-
          ${{ env.CHANGE == 'parent' && format('agent,plan approved{0}', needs.route.outputs.release_label != '' && format(',{0}', needs.route.outputs.release_label) || '') ||
          env.FIX == 'true' && env.PLAN != 'true' && 'agent,bug,plan approved' ||
          env.FIX == 'true' && 'agent,bug' || 'agent' }}
        body: |
          Closes #${{ needs.route.outputs.number }}

          ${{ env.CHANGE == 'sub' && format('Part of #{0}: merges into {1}.', needs.route.outputs.family, env.BASE) || env.CHANGE == 'parent' && 'The family''s work, each part merged here from its own sub-issue''s change.' || format('Starts from #{0}''s notes.', needs.route.outputs.number) }}

          ${{ needs.route.outputs.upstream != '' && format('Adopts a release of {0}.', needs.route.outputs.upstream) || '' }}

          ${{ needs.route.outputs.upstream != '' && format('<!-- upstream: {0} -->', needs.route.outputs.upstream) || '' }}

    # the family's pull request carries the parent's open questions, the list its last turn
    # kept, for Dr K to answer there (R-SM22a), and the `agent` sub-issues still open (R-SM30),
    # both refreshed each time the parent asks for it
    - name: Open Questions
      if: env.CHANGE == 'parent' && steps.pr.outputs.number != ''
      continue-on-error: true
      uses: kubed-io/actions/issue-agent/questions@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        sub_issues: ${{ needs.route.outputs.open_sub_issues }}

    # A PR that opens conflicting with its base runs no checks (GitHub starts no
    # pull_request workflow on one), so no agent would hear of it: "Fresh from the Base"
    # only warns. pr-update does what a merge into the base does for every open PR there:
    # update-branch, else the merge with the docs pointer and the changelog resolved, else
    # the `agent-code` dispatch (reason `conflict`) naming the paths, for the agent to merge
    # with git (selenium-flow#145, 2026-11-14).
    - name: Checkout for the Update
      if: steps.pr.outputs.number != '' && steps.ahead.outputs.by != '0'
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Bring It Up to Date
      if: steps.pr.outputs.number != ''
      uses: kubed-io/actions/pr-update@main
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        base: ${{ env.BASE }}

    # a fix with no plan starts at the code: the code agent's own event, its first turn
    # built from the report (pr-route's `fix` reason)
    - name: Start the Fix
      if: env.FIX == 'true' && env.PLAN != 'true' && steps.pr.outputs.number != ''
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        PR: ${{ steps.pr.outputs.number }}
      run: |
        gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=agent-code \
          -F "client_payload[pull_request]=${PR}" -f "client_payload[reason]=fix"

  plan:
    name: Plan
    needs: handoff
    if: >-
      github.event_name == 'repository_dispatch' && needs.handoff.outputs.pull_request != '' &&
        needs.handoff.outputs.change != 'parent' && needs.handoff.outputs.plan == 'true'
    runs-on: claude
    environment: claude
    # the PR's group, shared with agent-pr.yml
    concurrency:
      group: agent-pr-${{ needs.handoff.outputs.pull_request }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # the agent-flow channel's token: n8n's messages reach the running turn
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.handoff.outputs.branch }}
        submodules: true
        persist-credentials: false

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.handoff.outputs.pull_request }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.handoff.outputs.pull_request }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        live: true
        prompt: /mcp__plugin_kubed-runner_superpowers__superpowers_spec-approved

    # the role files, from the repo this workflow lives in at the commit it runs from; moved out
    # of the workspace so the agent has nothing of them to commit
    - name: Role Files
      uses: actions/checkout@v7
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .agent-flow
        sparse-checkout: .github/roles
        persist-credentials: false

    - name: Role Files Out of the Tree
      run: |
        mv .agent-flow "$RUNNER_TEMP/agent-flow"
        echo "AGENT_ROLES=$RUNNER_TEMP/agent-flow/.github/roles" >> "$GITHUB_ENV"

    - name: Plan Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        settings: ${{ env.AGENT_ROLES }}/plan/settings.json
        schema: ${{ env.AGENT_ROLES }}/plan/schema.json
        # n8n's dispatch makes the App the run's actor: Claude starts only for an allowed bot,
        # by login; the gate and the thread trust it by its bot's id
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,${{ steps.app.outputs.app-slug }}[bot]
        prompt: /mcp__plugin_kubed-runner_superpowers__superpowers_spec-approved
        # the PR's opening post is always new, so a quiet prompt would never be sent
        prompt_when: always
        header: "📄 Plan · [{{ output.plan_path }}]({{ link:output.plan_path }})"
        session_key: pr-${{ needs.handoff.outputs.pull_request }}
        live_messages: true

    # the plan and spec live under docs/, one signed commit
    - name: Commit the Plan
      id: commit
      if: fromJSON(steps.agent.outputs.output || '{}').commit_message
      # a refused commit is said in the answer; the job fails after it
      continue-on-error: true
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ needs.handoff.outputs.branch }}
        message: ${{ fromJSON(steps.agent.outputs.output).commit_message }}
        files: docs
        # the wiki has no commit API: pushed with git, its pointer in this commit
        submodules: ${{ inputs.wiki }}
        author: ${{ steps.app.outputs.app-slug }}
        # what a failed commit leaves is kept in the scratchpad for the next turn
        keep_to: .issue/scratch/uncommitted

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        comment_id: ${{ steps.agent.outputs.comment_id }}
        append: ${{ steps.commit.outputs.summary }}

    # a downstream change's plan is the epic's to approve: it hears the plan is ready (R-UR9)
    - name: Hand Back the Plan
      if: needs.handoff.outputs.upstream != '' && steps.commit.outcome == 'success'
      continue-on-error: true
      uses: kubed-io/actions/issue-agent/handback@main
      with:
        output: ${{ steps.agent.outputs.output }}
        kin: downstream-plan
        number: ${{ needs.handoff.outputs.number }}
        pull_request: ${{ needs.handoff.outputs.pull_request }}
        upstream: ${{ needs.handoff.outputs.upstream }}

    - name: The Commit Failed
      if: steps.commit.outcome == 'failure'
      run: echo "::error::the commit failed; its answer says why" && exit 1

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.handoff.outputs.pull_request }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Dr K ticked a suggested sub-issue (n8n's `sub-issue-accepted`): read the tick back from
  # GitHub, and the item from the proposal itself
  accept:
    name: Accept
    if: >-
      github.event_name == 'repository_dispatch' && github.event.action == 'sub-issue-accepted' &&
        github.event.sender.id == 235398881
    runs-on: ubuntu-26.04
    permissions:
      issues: read
    outputs:
      ok: ${{ steps.tick.outputs.ok }}
      number: ${{ steps.tick.outputs.number }}
      parent: ${{ steps.tick.outputs.parent }}
      family: ${{ steps.tick.outputs.family }}
      type: ${{ steps.tick.outputs.type }}
      title: ${{ steps.tick.outputs.title }}
    steps:

    - name: Read the Tick
      id: tick
      uses: kubed-io/actions/issue-agent/proposal@main
      with:
        github_token: ${{ github.token }}
        owner: "4399427"
        app: "235398881"

  # the agent writes the sub-issue whole, against its type's form, in the parent's session;
  # the job files it under the parent (spec 2026-11-03 R-M11). On Dr K's tick (accept), or on
  # the parent's `file` action (the route's `file` stage, R-SM19)
  make-sub-issue:
    # the family in the name: issue-route finds it by it, and a label then waits (R-L3)
    name: "Make the Sub-issue · #${{ needs.accept.outputs.family || needs.route.outputs.family }}"
    needs: [route, accept]
    # one of the two ran; the other is skipped
    if: >-
      github.event_name == 'repository_dispatch' && !cancelled() &&
        (needs.accept.outputs.ok == 'true' || needs.route.outputs.stage == 'file')
    runs-on: claude
    environment: claude
    # one issue turn at a time in the family; ticks queue, in order
    concurrency:
      group: agent-issue-${{ needs.accept.outputs.family || needs.route.outputs.family }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
      # the thread it answers on, its family, the issue to file under and the item's type: a
      # tick's, or the parent's own for a `file` action
      MAKE_NUMBER: ${{ needs.accept.outputs.number || needs.route.outputs.number }}
      MAKE_FAMILY: ${{ needs.accept.outputs.family || needs.route.outputs.family }}
      MAKE_PARENT: ${{ needs.accept.outputs.parent || needs.route.outputs.family }}
      MAKE_TYPE: ${{ needs.accept.outputs.type || needs.route.outputs.item_type }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: read
        permission-issues: write

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    # the form for the item's type, as the turn's output schema
    - name: Form
      id: form
      uses: kubed-io/actions/issue-template@main
      with:
        type: ${{ env.MAKE_TYPE }}

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.MAKE_NUMBER }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.MAKE_NUMBER }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ env.MAKE_NUMBER }}
        live: true

    # the role files, from the repo this workflow lives in at the commit it runs from; moved out
    # of the workspace so the agent has nothing of them to commit
    - name: Role Files
      uses: actions/checkout@v7
      with:
        repository: ${{ job.workflow_repository }}
        ref: ${{ job.workflow_sha }}
        path: .agent-flow
        sparse-checkout: .github/roles
        persist-credentials: false

    - name: Role Files Out of the Tree
      run: |
        mv .agent-flow "$RUNNER_TEMP/agent-flow"
        echo "AGENT_ROLES=$RUNNER_TEMP/agent-flow/.github/roles" >> "$GITHUB_ENV"

    - name: Sub-issue Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ env.MAKE_NUMBER }}
        settings: ${{ env.AGENT_ROLES }}/spec/settings.json
        schema: ${{ steps.form.outputs.schema }}
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,${{ steps.app.outputs.app-slug }}[bot]
        # the tick's turn is on an `agent` issue; the `file` action may be on an unlabelled parent (R-SM29)
        opt_in_label: ${{ needs.accept.outputs.ok == 'true' && 'agent' || needs.route.outputs.opt_in_label || 'agent' }}
        # a `file` action's comes from the route, with its ask on a line of its own
        prompt: >-
          ${{ needs.route.outputs.prompt || format('/mcp__plugin_kubed-runner_superpowers__superpowers_make-sub-issue {0}: {1}',
          needs.accept.outputs.type, needs.accept.outputs.title) }}
        prompt_when: always
        # the parent's session: it decides what the sub-issue is (R-SM15)
        session_key: issue-${{ env.MAKE_FAMILY }}
        live_messages: true

    # create, link under the parent, then `agent`, and a "Filed #N" line in the answer
    - name: File the Sub-issue
      id: file
      uses: kubed-io/actions/issue-template/file@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        form: ${{ steps.form.outputs.form }}
        output: ${{ steps.agent.outputs.output }}
        parent: ${{ env.MAKE_PARENT }}
        labels: agent
        number: ${{ env.MAKE_NUMBER }}

    # a parent is an epic once its first sub-issue is filed (Decided 11); adding it again is nothing
    - name: Label the Epic
      if: steps.file.outputs.created == 'true'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: gh api "repos/${GITHUB_REPOSITORY}/issues/${MAKE_FAMILY}/labels" -f "labels[]=epic" --silent

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ env.MAKE_NUMBER }}
        comment_id: ${{ steps.agent.outputs.comment_id }}

    # the new sub-issue starts by itself: n8n takes its number and wakes its first turn
    # (`sub-issue-start`, R-SM25); one the parent already had is not filed again, nor started
    - name: Hand Back the Filing
      if: steps.file.outputs.created == 'true' && steps.file.outputs.number != ''
      continue-on-error: true
      uses: kubed-io/actions/issue-agent/handback@main
      with:
        kin: filed
        number: ${{ steps.file.outputs.number }}
        parent: ${{ env.MAKE_FAMILY }}

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ env.MAKE_NUMBER }}-${{ github.run_id }}-${{ github.run_attempt }}
