name: Kubectl Summary
description: |
  Writes a kubectl command's output to the step summary: `build` as an accordion of kinds and
  resources, `plan` as a diff per resource with the counts to create, update and prune, `up` as
  what changed with the unchanged folded away. Any other command is its output in a block.

inputs:
  cmd:
    description: The kubectl command the output came from (build, plan, up, …).
    required: true
  file:
    description: The file holding the command's output.
    required: true
  args:
    description: The arguments it ran with, for the heading; `.` is left out.
    required: false
    default: .
  error_file:
    description: The command's stderr, shown when it failed.
    required: false
    default: ""
  outcome:
    description: The command step's outcome; anything but success leads with the error.
    required: false
    default: success

runs:
  using: composite
  steps:

  - name: Summary
    uses: actions/github-script@v9
    env:
      CMD: ${{ inputs.cmd }}
      ARGS: ${{ inputs.args }}
      OUTPUT_FILE: ${{ inputs.file }}
      ERROR_FILE: ${{ inputs.error_file }}
      OUTCOME: ${{ inputs.outcome }}
      SUMMARY_JS: ${{ github.action_path }}/lib/summary.js
    with:
      script: |
        await require(process.env.SUMMARY_JS).run({ core });
