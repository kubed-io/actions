name: Plan Agent (Claude)
description: >
  The "plan" half of an issue → plan → build loop, or (mode: reply) a Claude that
  answers in an issue thread. Claude reads the issue thread and repo and returns a
  structured {reply, plan} (or {reply}). It is given NO write, edit,
  bash, or GitHub tools — so it physically cannot implement, commit, branch, open
  a PR, or post to GitHub. All GitHub I/O is done by deterministic github-script
  steps: a pre-step hands Claude the conversation as a file, and a post-step posts
  a short reply plus syncs the plan into the issue body (below a hard divider,
  under the human's original request) — so it becomes the prompt GitHub Copilot
  reads when the issue is assigned to it.

  Caller responsibilities: check out the repo, run kluster-konnect (its GCP auth
  is what fetches the keys), provide an Anthropic key + a GitHub (app) token, and
  gitignore the scratch_dir.

inputs:
  anthropic_api_key:
    description: >
      Anthropic API key for claude-code-action. Optional: with neither this nor
      claude_code_oauth_token, claude-code-action takes ANTHROPIC_API_KEY or
      CLAUDE_CODE_OAUTH_TOKEN from the job's env (the kubed-io claude runner puts
      its subscription token there).
    required: false
    default: ""
  claude_code_oauth_token:
    description: Claude subscription token (`claude setup-token`); an alternative to anthropic_api_key.
    required: false
    default: ""
  github_token:
    description: >
      Token the action comments with — typically a GitHub App installation token
      so comments come from your app.
    required: true
  mode:
    description: >
      `plan` (default): return {reply, plan}; the plan is synced into the issue body.
      `reply`: return {reply} only, posted as a comment; the issue body is untouched.
    required: false
    default: plan
  agent:
    description: >
      Optional repo agent (.claude/agents/<name>.md) to run the session as, via
      --agent. Its prompt replaces Claude Code's own; the mode's role is appended.
    required: false
    default: ""
  model:
    description: Claude model (alias like `sonnet`/`opus`, or a full id).
    required: false
    default: sonnet
  max_turns:
    description: Max Claude Code turns (homework headroom; only used turns are billed).
    required: false
    default: "40"
  marker:
    description: >
      Hidden HTML-comment marker that bounds the agent-maintained plan section in
      the issue body. Everything before it is the human's request (left untouched);
      everything after is regenerated each run.
    required: false
    default: "<!-- plan-agent -->"
  scratch_dir:
    description: >
      Gitignored dir for the conversation hand-off file the agent reads. MUST be
      gitignored in the caller repo.
    required: false
    default: .plan
  context_file:
    description: >
      Optional repo-relative file of app-specific guidance, appended to the
      agent's system prompt (e.g. conventions only this repo cares about).
    required: false
    default: ""
  mcp_config:
    description: >
      Optional extra MCP servers, as an inline JSON string OR a path (absolute, or
      repo-relative under the workspace) to a JSON file. When set, setup.sh renders
      it to a temp .mcp.json through envsubst and passes it to claude-code-action
      via --mcp-config (merged with the built-in GitHub MCP). Env-var placeholders
      like ${N8N_MCP_TOKEN} are interpolated from the environment at runtime, so a
      bearer token can be supplied via env and is never hardcoded here. Unset = no
      extra MCP servers (default behavior).
    required: false
    default: ""
  allowed_tools:
    description: >
      Optional comma-separated tools to allow (e.g. `Bash(kubectl build:*)`). Every
      server in mcp_config is allowed on top.
    required: false
    default: ""
  disallowed_tools:
    description: >
      Tools the agent never gets. Defaults to the read-only guardrail; pass "" to
      lift it (e.g. for an agent that may write scratch files).
    required: false
    default: Bash,Edit,Write,MultiEdit,NotebookEdit
  session_key:
    description: >
      Optional key that makes the conversation resumable (e.g. `issue-12`): the
      same key resumes the same Claude session where sessions persist (the kubed-io
      claude runner's /claude); elsewhere each run starts it fresh.
    required: false
    default: ""
  session_title:
    description: The session's name when it starts (shown in /resume and Grafana); defaults to session_key.
    required: false
    default: ""
  claude_args:
    description: Extra flags appended to Claude's command line (e.g. `--permission-mode acceptEdits`).
    required: false
    default: ""
  allowed_bots:
    description: Bots allowed to trigger the run (claude-code-action refuses bot actors otherwise).
    required: false
    default: ""
  path_to_claude_code_executable:
    description: A preinstalled Claude Code; defaults to the runner's PATH_TO_CLAUDE_CODE_EXECUTABLE, else the action installs it.
    required: false
    default: ""
  path_to_bun_executable:
    description: A preinstalled Bun; defaults to the runner's PATH_TO_BUN_EXECUTABLE, else the action installs it.
    required: false
    default: ""
  extra_disallowed_tools:
    description: >
      Optional comma-separated tool names appended to the built-in --disallowedTools
      (Bash,Edit,Write,MultiEdit,NotebookEdit). Use to deny an MCP server's write
      tools so an MCP-enabled run stays read-only (e.g. the n8n write tools). Unset =
      only the built-in list is denied (default behavior).
    required: false
    default: ""

runs:
  using: composite
  steps:

    # $GITHUB_ACTION_PATH is this action's dir in every step (composite run steps
    # and the nested github-script steps alike), so it's how each step reaches the
    # sibling files. setup.sh builds the system prompt + minifies the schema and
    # writes both as step outputs.
    - name: Setup
      id: setup
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        AGENT: ${{ inputs.agent }}
        CONTEXT_FILE: ${{ inputs.context_file }}
        MCP_CONFIG: ${{ inputs.mcp_config }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        EXTRA_DISALLOWED_TOOLS: ${{ inputs.extra_disallowed_tools }}
        SESSION_KEY: ${{ inputs.session_key }}
        SESSION_TITLE: ${{ inputs.session_title }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"

    # Hand the agent the issue + full comment thread as a file it can Read — so it
    # never needs (blocked) GitHub access for context.
    - name: Gather issue context
      uses: actions/github-script@v9
      env:
        SCRATCH_DIR: ${{ inputs.scratch_dir }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(`${process.env.GITHUB_ACTION_PATH}/gather-context.js`)({ github, context, core });

    # Automation mode + --json-schema: the agent reads the context file + repo and
    # returns {reply, plan} as structured output. Write/Edit/Bash/etc. are all
    # disallowed, so it has only read-only tools — it cannot modify the repo, run
    # commands, commit, or open a PR. It does no GitHub I/O at all.
    - name: Run Claude
      id: claude
      uses: anthropics/claude-code-action@v1
      with:
        anthropic_api_key: ${{ inputs.anthropic_api_key }}
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        allowed_bots: ${{ inputs.allowed_bots }}
        path_to_claude_code_executable: ${{ inputs.path_to_claude_code_executable || env.PATH_TO_CLAUDE_CODE_EXECUTABLE }}
        path_to_bun_executable: ${{ inputs.path_to_bun_executable || env.PATH_TO_BUN_EXECUTABLE }}
        show_full_output: true
        # A resumed reply session already holds the conversation, so it reads only the
        # new message; context.md stays there to catch up on anything it missed.
        prompt: >-
          ${{ inputs.mode == 'reply' && steps.setup.outputs.resumed == 'true'
            && format('There is a new message in this issue, in the file {0}/latest.md at the repo root; your earlier turns are in this session. Answer it. If you need to catch up on comments you have not seen, the whole thread is in {0}/context.md. Return the structured reply object per your role.', inputs.scratch_dir)
            || inputs.mode == 'reply'
            && format('Answer the latest message in this issue. The issue body and the full comment thread are in the file {0}/context.md at the repo root; read it first. Return the structured reply object per your role.', inputs.scratch_dir)
            || format('Produce or refine the plan for this issue. The issue body and the full comment thread are in the file {0}/context.md at the repo root; read it first, then do repo homework with your read-only tools. Return the structured reply and plan object per your role.', inputs.scratch_dir) }}
        claude_args: |
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max_turns }}
          --append-system-prompt-file ${{ steps.setup.outputs.system_prompt_file }}
          --json-schema '${{ steps.setup.outputs.schema }}'
          ${{ steps.setup.outputs.args }}
          ${{ inputs.claude_args }}

    # Deterministic publish: sync `plan` into the issue body below a hard divider
    # (the human's request stays above it, untouched) and post `reply` as a short
    # new comment. The agent never touched GitHub — this step does.
    - name: Publish plan + reply
      if: ${{ steps.claude.outputs.structured_output != '' }}
      uses: actions/github-script@v9
      env:
        MARKER: ${{ inputs.marker }}
        STRUCTURED: ${{ steps.claude.outputs.structured_output }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(`${process.env.GITHUB_ACTION_PATH}/publish-plan.js`)({ github, context, core });
