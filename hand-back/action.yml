name: Hand Back
description: >
  Sends a repository_dispatch at the very end of the job, from its post step. In Copilot's
  `copilot-setup-steps` job that is after Copilot's review is posted: the hand-back to
  whatever answers the review, since every run Copilot triggers directly is held. For
  repositories without n8n: where n8n relays the review (`agent-route`), nothing hands back.

inputs:
  token:
    description: A token that may send a repository_dispatch (contents write) and read the run (actions read).
    required: false
    default: ${{ github.token }}
  event_type:
    description: The repository_dispatch event type.
    required: false
    default: copilot-review
  reason:
    description: "`client_payload.reason`, for a receiver that routes by it (agent-code's `copilot`); none when empty."
    required: false
    default: ""

runs:
  using: node24
  main: main.js
  post: post.js
