name: Build and push Docker Image
description: Deploy to Kubernetes using Helm
inputs: 
  push:
    description: 'Whether to push the image to DockerHub'
    required: false
    default: 'false'
  username:
    description: 'DockerHub Username'
    required: false
  password:
    description: 'DockerHub Password'
    required: false
  repository:
    description: 'DockerHub Repository'
    required: false
runs:
  using: composite
  steps:
  
  # buildx's `type=gha` cache backend reads ACTIONS_RUNTIME_TOKEN and
  # ACTIONS_RESULTS_URL from the environment, and ACTIONS_CACHE_SERVICE_V2 to
  # select the v2 cache API that replaced the retired v1. The runner hands those
  # to JS actions only — never to a `run:` step — so the `docker buildx bake`
  # below cannot see them, and without them the cache is a SILENT no-op: it
  # neither imports nor exports and reports nothing.
  #
  # Found in kubed-io/selenium-flow, whose docker-compose.yaml had carried
  # cache-to/cache-from since it was written and had never once produced a
  # CACHED layer. With this, a source-only multi-arch build there went from
  # 9m30 to ~2m20. Every repo calling this action was in the same state.
  #
  # Getting the list wrong is worse than not having it: omitting the V2 flag
  # made buildx talk to the decommissioned v1 endpoint, which answers with an
  # HTML error page, which fails the BUILD rather than just the cache. That is
  # the argument for this action over exporting the variables by hand.
  - name: Expose GitHub Runtime
    uses: crazy-max/ghaction-github-runtime@v4

  - name: Setup QEMU
    id: setup-qemu
    uses: docker/setup-qemu-action@v4
    with:
      # Skip caching the tonistiigi/binfmt installer image. The actions/cache
      # entry that backs it (`docker.io--tonistiigi--binfmt-latest-linux-x64`)
      # is repo-wide, so reservations race when image builds overlap or when
      # a prior run dies mid-save and leaves a stale reservation. The binfmt
      # image is ~5MB; re-pulling on every run is cheaper than the annotation
      # noise (and the time spent diagnosing it).
      cache-image: false

  - name: Set up Docker Buildx
    id: buildx
    uses: docker/setup-buildx-action@v4

  - name: Set Image Args
    shell: bash
    run: |
      {
        echo "GIT_REF=$(echo ${GITHUB_REF##*/} | sed -e 's/\//_/g')";
        echo "GIT_SHA=$(git rev-parse --short HEAD)";
      } >> $GITHUB_ENV
    
  - name: Login to DockerHub
    id: login-dockerhub
    if: inputs.push == 'true'
    uses: docker/login-action@v4
    with:
      username: ${{ inputs.username }}
      password: ${{ inputs.password }}

  - name: Build and Push
    shell: bash
    env:
      PUSH_FLAG: ${{ (inputs.push == 'true') && '--push' || '' }}
    run: docker buildx bake $PUSH_FLAG

  - name: Docker Hub Description
    uses: peter-evans/dockerhub-description@v5
    if: inputs.push == 'true'
    with:
      username: ${{ inputs.username }}
      password: ${{ inputs.password }}
      repository: ${{ inputs.repository || github.repository }}
