name: Kubectl
description: Runs a kubectl command and writes the output to the job step summary.
inputs:
  cmd:
    description: kubectl subcommand to run (e.g. build, up)
    required: true
  args:
    description: Arguments passed after the command
    required: false
    default: .
  namespace:
    description: Target namespace (-n)
    required: false
runs:
  using: composite
  steps:

  - name: Build Args
    id: args
    shell: bash
    run: |
      ARGS="${{ inputs.cmd }}"
      if [ -n "${{ inputs.namespace }}" ]; then
        ARGS="$ARGS --namespace=${{ inputs.namespace }}"
      fi
      ARGS="$ARGS ${{ inputs.args }}"
      echo "args=$ARGS" >> $GITHUB_OUTPUT

  - name: Kubectl
    id: kubectl
    shell: bash
    env:
      ARGS: ${{ steps.args.outputs.args }}
      KUBECTL_APPLYSET: "true"
    # stderr kept apart, so a build stays YAML and a failure has its error for the summary
    run: |
      OUT="$RUNNER_TEMP/kubectl-out.txt"
      ERR="$RUNNER_TEMP/kubectl-err.txt"
      echo "output_file=$OUT" >> $GITHUB_OUTPUT
      set +e
      kubectl $ARGS 2> "$ERR" | tee "$OUT"
      RC=${PIPESTATUS[0]}
      cat "$ERR" >&2
      exit $RC

  - name: Summary
    if: always()
    uses: actions/github-script@v9
    env:
      CMD: ${{ inputs.cmd }}
      ARGS: ${{ inputs.args }}
      OUTPUT_FILE: ${{ runner.temp }}/kubectl-out.txt
      ERROR_FILE: ${{ runner.temp }}/kubectl-err.txt
      OUTCOME: ${{ steps.kubectl.outcome }}
      SUMMARY_JS: ${{ github.action_path }}/summary/lib/summary.js
    with:
      script: |
        await require(process.env.SUMMARY_JS).run({ core });
