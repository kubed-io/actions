name: Kubectl
description: Runs a kubectl command, its stdout and stderr each kept in a file for the steps after it.
inputs:
  cmd:
    description: kubectl subcommand to run (e.g. build, up)
    required: true
  args:
    description: Arguments passed after the command
    required: false
    default: .
  namespace:
    description: Target namespace (-n)
    required: false
outputs:
  output_file:
    description: The command's stdout, a file of its own for each run.
    value: ${{ steps.kubectl.outputs.output_file }}
  error_file:
    description: The command's stderr, beside it.
    value: ${{ steps.kubectl.outputs.error_file }}
runs:
  using: composite
  steps:

  - name: Build Args
    id: args
    shell: bash
    run: |
      ARGS="${{ inputs.cmd }}"
      if [ -n "${{ inputs.namespace }}" ]; then
        ARGS="$ARGS --namespace=${{ inputs.namespace }}"
      fi
      ARGS="$ARGS ${{ inputs.args }}"
      echo "args=$ARGS" >> $GITHUB_OUTPUT

  - name: Kubectl
    id: kubectl
    shell: bash
    env:
      ARGS: ${{ steps.args.outputs.args }}
      KUBECTL_APPLYSET: "true"
    # each run its own files, so several in a job keep theirs; stderr apart, so a
    # build stays YAML and a failure's error can be shown
    run: |
      OUT="$(mktemp -p "$RUNNER_TEMP" kubectl-out-XXXXXX.txt)"
      ERR="${OUT/kubectl-out-/kubectl-err-}"
      echo "output_file=$OUT" >> $GITHUB_OUTPUT
      echo "error_file=$ERR" >> $GITHUB_OUTPUT
      set +e
      kubectl $ARGS 2> "$ERR" | tee "$OUT"
      RC=${PIPESTATUS[0]}
      cat "$ERR" >&2
      exit $RC
