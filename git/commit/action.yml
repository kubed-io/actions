name: Git · Commit
description: >
  Commits the checkout's changes to a branch through the API, so GitHub signs the commit.
  A submodule checked out at a new commit moves its pointer in the same commit (the Git
  Data API); one listed in `submodules` with changes inside it (a wiki, which has no commit
  API) is committed and pushed with git first. Afterwards HEAD and the index match the
  commit and the working tree is left as it was. It never overwrites: when the branch moved
  since the checkout's commit and changed a path the commit writes, nothing is committed
  and the step fails naming them. A failed commit can keep its changes (`keep_to`), and
  `summary` says what is not on the branch.

inputs:
  token:
    description: A token that may write contents; the App's, so the commit wakes workflows.
    required: true
  message:
    description: The commit message; its first line is the headline.
    required: true
  trailers:
    description: "`Key: value` lines added after the message, a blank line between (`Agent: done`)."
    required: false
    default: ""
  files:
    description: Paths or globs (`**`, `*`, `?`), one per line; only matching changes are committed. Every change when empty.
    required: false
    default: ""
  ignore:
    description: Paths or globs, one per line, left out of the commit with a warning even when they changed.
    required: false
    default: ""
  branch:
    description: The branch to commit to, which must exist (git/branch makes it); the checkout's when empty.
    required: false
    default: ""
  allow_empty:
    description: Commit even with no changes, so a PR can open on a new branch.
    required: false
    default: "false"
  submodules:
    description: >
      Submodule paths, one per line, this commit may commit inside: changes in one that
      `files` reaches are committed on its branch (.gitmodules', else master) and pushed with
      git, then its pointer moves in this commit. Any other submodule is never pushed.
    required: false
    default: ""
  author:
    description: The App's slug; its bot authors a submodule's commit. Needed only when one changed.
    required: false
    default: ""
  keep_to:
    description: >
      A folder from the repository's top: when the commit fails, its changes are written
      there (each file, the deletions, a patch, a README) so they are not lost. None when
      empty.
    required: false
    default: ""

outputs:
  sha:
    description: The commit; empty when nothing was committed.
    value: ${{ steps.commit.outputs.sha }}
  url:
    description: The commit's URL; empty when nothing was committed.
    value: ${{ steps.commit.outputs.url }}
  files:
    description: JSON list of the committed paths, deletions included.
    value: ${{ steps.commit.outputs.files }}
  ignored:
    description: JSON list of the changed paths `ignore` left out.
    value: ${{ steps.commit.outputs.ignored }}
  committed:
    description: "`false` when there was nothing to commit and allow_empty is off."
    value: ${{ steps.commit.outputs.committed }}
  conflicts:
    description: JSON list of the paths the branch changed too, when that refused the commit; empty otherwise.
    value: ${{ steps.commit.outputs.conflicts }}
  kept:
    description: "`true` when a failed commit's changes were written to `keep_to`."
    value: ${{ steps.commit.outputs.kept }}
  summary:
    description: >
      Markdown for a reader saying what is not on the branch: the commit failed or was
      refused, or `ignore` left paths out. Empty when everything selected was committed.
    value: ${{ steps.commit.outputs.summary }}

runs:
  using: composite
  steps:

  - name: Commit
    id: commit
    uses: actions/github-script@v9
    env:
      MESSAGE: ${{ inputs.message }}
      FILES: ${{ inputs.files }}
      IGNORE: ${{ inputs.ignore }}
      BRANCH: ${{ inputs.branch }}
      ALLOW_EMPTY: ${{ inputs.allow_empty }}
      TRAILERS: ${{ inputs.trailers }}
      SUBMODULES: ${{ inputs.submodules }}
      AUTHOR: ${{ inputs.author }}
      KEEP_TO: ${{ inputs.keep_to }}
      TOKEN: ${{ inputs.token }}
    with:
      github-token: ${{ inputs.token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/../lib/commit.js`).run({ github, context, core, exec });
