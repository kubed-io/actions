name: 🧭 Agent · Issue

# The issue is where the spec is made. On an `enhancement` issue, Dr K's `agent` label opts
# it in, and every comment from Dr K is the next turn: the agent researches, brainstorms,
# and keeps its notes at the bottom of the issue. With the `spec` label it also gets the
# branch issue-<N>, writes its draft spec there (docs/) and it is committed every
# turn. `spec approved` opens the draft PR from that branch, or from a new one with an
# empty commit, and starts the plan on it.
#
# n8n decides when this runs: it drops the noise and sends what is a turn as an
# `agent-issue` dispatch, a pointer the route job reads back from GitHub (spec §8.4).
#
# The job gates name ids, not variables: a job's `if` is decided before any runner, so
# only GitHub's own event data can vouch for the sender. 4399427 is Dr K, 235398881 the
# kubed-io App (n8n's dispatches). Who else counts inside a run comes from the claude
# runner's env.
#
# A repo calls this from its agent-issue.yml, on the `agent-issue` dispatch. The jobs on the
# claude runner run for a dispatch only: the runner group lists this file, and a dispatch
# always runs the caller on the default branch, never a branch's copy.

on:
  workflow_call:
    inputs:
      wiki:
        description: >-
          The wiki submodule's path: `docs` when the specs live in the wiki, which then
          lands first and docs/ is its pointer; `wiki` when docs/ is in the repo; empty for
          none.
        type: string
        required: true

permissions: {}

jobs:

  # what the event is for: a spec turn, the hand-off, or nothing, read back from GitHub
  route:
    name: Route
    if: >-
      (github.event_name != 'repository_dispatch' &&
        github.event.sender.id == 4399427 &&
        github.triggering_actor == 'kferrone' &&
        !github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'agent') &&
        (github.event_name == 'issue_comment' || contains(fromJSON('["agent","spec","spec approved"]'), github.event.label.name))) ||
      (github.event_name == 'repository_dispatch' && github.event.action == 'agent-issue' &&
        github.event.sender.id == 235398881)
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: read
    outputs:
      stage: ${{ steps.route.outputs.stage }}
      number: ${{ steps.route.outputs.number }}
      family: ${{ steps.route.outputs.family }}
      change: ${{ steps.route.outputs.change }}
      label: ${{ steps.route.outputs.label }}
      writes: ${{ steps.route.outputs.writes }}
      role: ${{ steps.route.outputs.role }}
      prompt: ${{ steps.route.outputs.prompt }}
      prompt_when: ${{ steps.route.outputs.prompt_when }}
      takeover: ${{ steps.route.outputs.takeover }}
      title: ${{ steps.route.outputs.title }}
    steps:

    - name: Route
      id: route
      uses: kubed-io/actions/issue-route@main
      with:
        # the kubed-runner plugin's superpowers server: its prompts' slash names
        prompts: /mcp__plugin_kubed-runner_superpowers__superpowers_
        owner: "4399427"
        app: "235398881"

  spec:
    name: Spec
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'spec'
    runs-on: claude
    environment: claude
    # one turn at a time in a family (an issue and its sub-issues): Dr K's comments queue, in
    # order; a label takes the family over
    concurrency:
      group: agent-issue-${{ needs.route.outputs.family }}
      cancel-in-progress: ${{ needs.route.outputs.takeover == 'true' }}
      queue: ${{ needs.route.outputs.takeover == 'true' && 'single' || 'max' }}
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      # the `spec` label gives the agent a branch, and files that are committed
      WRITES: ${{ needs.route.outputs.writes }}
      BRANCH: issue-${{ needs.route.outputs.number }}
      # the agent-flow channel's token: n8n's messages reach the running turn
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-issues: write

    - name: Branch
      if: env.WRITES == 'true'
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        issue: ${{ needs.route.outputs.number }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ env.WRITES == 'true' && env.BRANCH || '' }}
        submodules: true
        persist-credentials: false

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        live: true
        prompt: ${{ needs.route.outputs.prompt_when == 'always' && needs.route.outputs.prompt || '' }}

    - name: Spec Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        # a Feature's turn is the spec agent's, a Bug's the debug agent's
        settings: ${{ env.CLAUDE_AGENTS }}/${{ needs.route.outputs.role }}/settings.json
        schema: ${{ env.CLAUDE_AGENTS }}/${{ needs.route.outputs.role }}/schema.json
        # n8n's dispatch makes the App the run's actor: Claude starts only for an allowed bot,
        # by login; the gate and the thread trust it by its bot's id
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,${{ steps.app.outputs.app-slug }}[bot]
        opt_in_label: agent
        # a label's turn is a kb prompt (superpowers library)
        prompt: ${{ needs.route.outputs.prompt }}
        prompt_when: ${{ needs.route.outputs.prompt_when }}
        # the family's conversation: a sub-issue goes on in the session that wrote it
        session_key: issue-${{ needs.route.outputs.family }}
        allowed_tools: ${{ env.WRITES == 'true' && 'Read,Glob,Grep,Write,Edit' || 'Read,Glob,Grep' }}
        disallowed_tools: ${{ env.WRITES == 'true' && 'Bash,NotebookEdit' || 'Bash,Edit,Write,MultiEdit,NotebookEdit' }}
        live_messages: true

    # the draft spec lives under docs/: the wiki first when docs/ is the wiki, then one signed
    # commit
    - name: Land the Spec
      if: env.WRITES == 'true'
      uses: kubed-io/actions/issue-agent/land@main
      with:
        parts: true
        keep_scratch: false
        number: ${{ steps.agent.outputs.number }}
        token: ${{ steps.app.outputs.token }}
        app_slug: ${{ steps.app.outputs.app-slug }}
        branch: ${{ env.BRANCH }}
        output: ${{ steps.agent.outputs.output }}
        comment_id: ${{ steps.agent.outputs.comment_id }}
        files: docs
        wiki: ${{ inputs.wiki }}

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.route.outputs.number }}
        comment_id: ${{ steps.agent.outputs.comment_id }}

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.route.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  handoff:
    name: Hand Off
    needs: route
    if: github.event_name == 'repository_dispatch' && needs.route.outputs.stage == 'handoff'
    runs-on: claude
    environment: claude
    # it touches no session, so it runs in a lock of its own, never in the family's
    concurrency:
      group: agent-handoff-${{ needs.route.outputs.number }}
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BRANCH: issue-${{ needs.route.outputs.number }}
      DEFAULT: ${{ github.event.repository.default_branch }}
      # a sub-issue's change goes into its family's branch; any other into the default branch
      BASE: ${{ needs.route.outputs.change == 'sub' && format('issue-{0}', needs.route.outputs.family) || github.event.repository.default_branch }}
      CHANGE: ${{ needs.route.outputs.change }}
    outputs:
      pull_request: ${{ steps.pr.outputs.number }}
      branch: ${{ env.BRANCH }}
      change: ${{ env.CHANGE }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    # a sub-issue's family branch: made from the default branch by whichever hand-off needs it
    # first, and kept fresh from it
    - name: Family Branch
      if: env.CHANGE == 'sub'
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BASE }}
        issue: ${{ needs.route.outputs.family }}

    - name: Family Fresh from the Default Branch
      if: env.CHANGE == 'sub'
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: |
        [ "$(gh api "repos/${GITHUB_REPOSITORY}/compare/${DEFAULT}...${BASE}" --jq .behind_by)" = 0 ] && exit 0
        gh api "repos/${GITHUB_REPOSITORY}/merges" -f base="$BASE" -f head="$DEFAULT" \
          -f commit_message="Merge ${DEFAULT} into ${BASE}" --silent \
          || echo "::warning::${DEFAULT} could not be merged into ${BASE}; the family branch stays as it is"

    # found when the `spec` label made it; made from the base, linked to the issue, when not
    - name: Branch
      uses: kubed-io/actions/git/branch@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        base: ${{ env.BASE }}
        issue: ${{ needs.route.outputs.number }}

    # the plan starts from the base as it is today. When docs/ is the wiki, a spec branch
    # holds only wiki pointer commits, so it starts over there and the commit below points
    # docs at the wiki, which has the spec; merging would conflict on that pointer. Anything
    # else on the branch gets the base merged in.
    - name: Fresh from the Base
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
        DOCS_WIKI: ${{ inputs.wiki == 'docs' }}
      run: |
        compare="repos/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}"
        [ "$(gh api "$compare" --jq .behind_by)" = 0 ] && exit 0
        if [ "$DOCS_WIKI" = true ] && [ "$(gh api "$compare" --jq '[.files[].filename] | unique | join(",")')" = docs ]; then
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" \
            -f sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${BASE}" --jq .sha)" -F force=true --silent
        elif ! gh api "repos/${GITHUB_REPOSITORY}/merges" -f base="$BRANCH" -f head="$BASE" \
            -f commit_message="Merge ${BASE} into ${BRANCH}" --silent; then
          echo "::warning::${BASE} could not be merged into ${BRANCH}; the plan starts from the branch as it is"
        fi

    # GitHub opens no PR on a branch with nothing beyond its base
    - name: Ahead of the Base
      id: ahead
      env:
        GH_TOKEN: ${{ steps.app.outputs.token }}
      run: echo "by=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE}...${BRANCH}" --jq .ahead_by)" >> "$GITHUB_OUTPUT"

    - name: Checkout
      if: steps.ahead.outputs.by == '0'
      uses: actions/checkout@v7
      with:
        ref: ${{ env.BRANCH }}
        submodules: ${{ inputs.wiki == 'docs' }}
        persist-credentials: false

    # the wiki's head has every spec pushed so far, this issue's among them
    - name: Point at the Wiki
      if: steps.ahead.outputs.by == '0' && inputs.wiki == 'docs'
      run: git submodule update --remote docs

    - name: Start Commit
      if: steps.ahead.outputs.by == '0'
      uses: kubed-io/actions/git/commit@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        message: "Start #${{ needs.route.outputs.number }}"
        files: docs
        allow_empty: true

    # A parent's change is the family's work, already planned, coded and reviewed in its
    # sub-issues' changes: it opens ready, with `plan approved` from the App (which wakes no
    # code turn), so its checks run and the review agent reviews it whole. A sub-issue's
    # change merges into the family's branch, where `Closes` closes nothing: the merge's
    # close is by hand.
    - name: Pull Request
      id: pr
      uses: kubed-io/actions/git/pr@main
      with:
        token: ${{ steps.app.outputs.token }}
        branch: ${{ env.BRANCH }}
        base: ${{ env.BASE }}
        title: ${{ needs.route.outputs.title }}
        draft: ${{ env.CHANGE != 'parent' }}
        # the agents' PR: the label wakes the review agent, and switches the agents off
        labels: ${{ env.CHANGE == 'parent' && 'agent,plan approved' || 'agent' }}
        body: |
          Closes #${{ needs.route.outputs.number }}

          ${{ env.CHANGE == 'sub' && format('Part of #{0}: merges into {1}.', needs.route.outputs.family, env.BASE) || env.CHANGE == 'parent' && 'The family''s work, each part merged here from its own sub-issue''s change.' || format('Starts from #{0}''s notes.', needs.route.outputs.number) }}

  plan:
    name: Plan
    needs: handoff
    if: github.event_name == 'repository_dispatch' && needs.handoff.outputs.pull_request != '' && needs.handoff.outputs.change != 'parent'
    runs-on: claude
    environment: claude
    # the PR's group, shared with agent-pr.yml
    concurrency:
      group: agent-pr-${{ needs.handoff.outputs.pull_request }}
      cancel-in-progress: true
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # the agent-flow channel's token: n8n's messages reach the running turn
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: write
        permission-pull-requests: write
        permission-issues: write

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.handoff.outputs.branch }}
        submodules: true
        persist-credentials: false

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.handoff.outputs.pull_request }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.handoff.outputs.pull_request }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        live: true
        prompt: /mcp__plugin_kubed-runner_superpowers__superpowers_spec-approved

    - name: Plan Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        settings: ${{ env.CLAUDE_AGENTS }}/plan/settings.json
        schema: ${{ env.CLAUDE_AGENTS }}/plan/schema.json
        allowed_tools: Read,Glob,Grep,Write,Edit
        disallowed_tools: Bash,NotebookEdit
        # n8n's dispatch makes the App the run's actor: Claude starts only for an allowed bot,
        # by login; the gate and the thread trust it by its bot's id
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,${{ steps.app.outputs.app-slug }}[bot]
        prompt: /mcp__plugin_kubed-runner_superpowers__superpowers_spec-approved
        # the PR's opening post is always new, so a quiet prompt would never be sent
        prompt_when: always
        header: "📄 Plan · [{{ output.plan_path }}]({{ link:output.plan_path }})"
        session_key: pr-${{ needs.handoff.outputs.pull_request }}
        live_messages: true

    # the plan and spec live under docs/: the wiki first when docs/ is the wiki, then one
    # signed commit
    - name: Land the Plan
      uses: kubed-io/actions/issue-agent/land@main
      with:
        parts: true
        keep_scratch: false
        number: ${{ steps.agent.outputs.number }}
        token: ${{ steps.app.outputs.token }}
        app_slug: ${{ steps.app.outputs.app-slug }}
        branch: ${{ needs.handoff.outputs.branch }}
        output: ${{ steps.agent.outputs.output }}
        comment_id: ${{ steps.agent.outputs.comment_id }}
        files: docs
        wiki: ${{ inputs.wiki }}

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.handoff.outputs.pull_request }}
        comment_id: ${{ steps.agent.outputs.comment_id }}

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.handoff.outputs.pull_request }}-${{ github.run_id }}-${{ github.run_attempt }}

  # Dr K ticked a suggested sub-issue (n8n's `sub-issue-accepted`): read the tick back from
  # GitHub, and the item from the proposal itself
  accept:
    name: Accept
    if: >-
      github.event_name == 'repository_dispatch' && github.event.action == 'sub-issue-accepted' &&
        github.event.sender.id == 235398881
    runs-on: ubuntu-26.04
    permissions:
      issues: read
    outputs:
      ok: ${{ steps.tick.outputs.ok }}
      number: ${{ steps.tick.outputs.number }}
      parent: ${{ steps.tick.outputs.parent }}
      family: ${{ steps.tick.outputs.family }}
      type: ${{ steps.tick.outputs.type }}
      title: ${{ steps.tick.outputs.title }}
    steps:

    - name: Read the Tick
      id: tick
      uses: kubed-io/actions/issue-agent/proposal@main
      with:
        github_token: ${{ github.token }}
        owner: "4399427"
        app: "235398881"

  # the agent writes the sub-issue whole, against its type's form, in the family's session;
  # the job files it under the parent (spec 2026-11-03 R-M11)
  make-sub-issue:
    name: Make the Sub-issue
    needs: accept
    if: github.event_name == 'repository_dispatch' && needs.accept.outputs.ok == 'true'
    runs-on: claude
    environment: claude
    # one issue turn at a time in the family; ticks queue, in order
    concurrency:
      group: agent-issue-${{ needs.accept.outputs.family }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
    env:
      AGENT_FLOW_N8N_TOKEN: ${{ secrets.AGENT_FLOW_N8N_TOKEN }}
    steps:

    - name: App Token
      id: app
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ vars.GH_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_KEY }}
        permission-contents: read
        permission-issues: write

    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: true
        persist-credentials: false

    # the form for the item's type, as the turn's output schema
    - name: Form
      id: form
      uses: kubed-io/actions/issue-template@main
      with:
        type: ${{ needs.accept.outputs.type }}

    # the scratchpad, once around the job: two agent runs in one job share a cache key
    - name: Restore the Scratchpad
      id: scratch
      uses: actions/cache/restore@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.accept.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.accept.outputs.number }}-

    # the answer's comment, up before the agent runs; comment/end writes it
    - name: Comment
      id: comment
      uses: kubed-io/actions/comment/start@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.accept.outputs.number }}
        live: true

    - name: Sub-issue Agent
      id: agent
      uses: kubed-io/actions/issue-agent@main
      with:
        comment_id: ${{ steps.comment.outputs.comment_id }}
        scratch_cache: false
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.accept.outputs.number }}
        settings: ${{ env.CLAUDE_AGENTS }}/spec/settings.json
        schema: ${{ steps.form.outputs.schema }}
        trusted: ${{ env.CLAUDE_OWNER_ID }},${{ env.CLAUDE_TRUSTED_BOTS }},235398881,${{ steps.app.outputs.app-slug }}[bot]
        opt_in_label: agent
        prompt: "/mcp__plugin_kubed-runner_superpowers__superpowers_make-sub-issue ${{ needs.accept.outputs.type }}: ${{ needs.accept.outputs.title }}"
        prompt_when: always
        # the family's one conversation (R-F2)
        session_key: issue-${{ needs.accept.outputs.family }}
        allowed_tools: Read,Glob,Grep
        disallowed_tools: Bash,Edit,Write,MultiEdit,NotebookEdit
        live_messages: true

    # create, link under the parent, then `agent`, and a "Filed #N" line in the answer
    - name: File the Sub-issue
      id: file
      uses: kubed-io/actions/issue-template/file@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        form: ${{ steps.form.outputs.form }}
        output: ${{ steps.agent.outputs.output }}
        parent: ${{ needs.accept.outputs.parent }}
        labels: agent
        number: ${{ needs.accept.outputs.number }}

    - name: Answer
      if: steps.comment.outputs.comment_id != ''
      uses: kubed-io/actions/comment/end@main
      with:
        github_token: ${{ steps.app.outputs.token }}
        number: ${{ needs.accept.outputs.number }}
        comment_id: ${{ steps.agent.outputs.comment_id }}

    - name: Save the Scratchpad
      if: always() && steps.scratch.outcome == 'success'
      continue-on-error: true
      uses: actions/cache/save@v6
      with:
        path: .issue/scratch
        key: agent-scratch-${{ github.repository_owner }}-${{ github.event.repository.name }}-${{ needs.accept.outputs.number }}-${{ github.run_id }}-${{ github.run_attempt }}
