name: Issue Agent (Claude)
description: >
  A Claude Code agent in a GitHub issue or pull request, as a real Claude Code session.
  The thread's new messages are the turn; the agent's reply is posted back, its notes are
  kept in the description, and on a pull request its review comments sit under the reply.
  Nothing else: no git, no workflow. The structured output it returns is this action's
  output, for the steps after it.

inputs:
  github_token:
    description: Token for the thread (issues, pull requests). The App's, so a ready-for-review or review it posts wakes workflows.
    required: true
  number:
    description: The issue or PR; defaults to the event's. Only for a run started off the thread.
    required: false
    default: ""
  agent:
    description: A Claude Code agent file (frontmatter and body), loaded with --agents and run with --agent; or the name of one Claude Code already knows.
    required: false
    default: ""
  schema:
    description: The role's output schema, inline JSON or a path. It becomes the `output` field beside the action's own.
    required: false
    default: ""
  append_system_prompt:
    description: This job's extras, inline text or a path, appended after the agent and the action's contract.
    required: false
    default: ""
  prompt:
    description: The event's turn, for an event with no words of Dr K's (a label, a push).
    required: false
    default: ""
  prompt_when:
    description: "`quiet`: the prompt is the turn only when the thread has nothing new. `always`: every run, quoted above the reply."
    required: false
    default: quiet
  header:
    description: "A markdown template above the reply: {{ output.<field> }}, {{ run_url }}, {{ session_id }}, {{ number }}, {{ blob }}. Empty, no header."
    required: false
    default: ""
  review:
    description: On a PR, give the agent `review`, line comments posted as one review under its reply.
    required: false
    default: "false"
  threads:
    description: On a PR, give the agent `threads`, its answers to the unresolved review threads.
    required: false
    default: "true"
  ready:
    description: On a draft PR, give the agent `ready`, which marks it ready for review.
    required: false
    default: "false"
  session_key:
    description: uuid5(repo + key) is the session id, resumed where /claude has its transcript.
    required: false
    default: ""
  trusted:
    description: Comma-separated user ids and bots (id or login) whose messages count; defaults to the runner's CLAUDE_OWNER_ID and CLAUDE_TRUSTED_BOTS.
    required: false
    default: ""
  opt_in_label:
    description: The run happens only if this label was last added by a trusted id.
    required: false
    default: ""
  max_runs:
    description: Cap on agent replies under this session_key in this thread (0 = none).
    required: false
    default: "0"
  mcp_config:
    description: MCP servers, inline JSON or a file; ${VAR} is filled from env. Every server is allowed.
    required: false
    default: ""
  model:
    description: Overrides the agent's model.
    required: false
    default: ""
  max_turns:
    description: Overrides the agent's maxTurns.
    required: false
    default: ""
  allowed_tools:
    description: Comma-separated tools to allow on top of the agent's.
    required: false
    default: ""
  disallowed_tools:
    description: Comma-separated tools to deny.
    required: false
    default: ""
  permission_mode:
    description: Overrides the agent's permissionMode.
    required: false
    default: ""
  claude_args:
    description: Extra Claude Code flags.
    required: false
    default: ""
  show_full_output:
    description: Print every Claude message to the log. Keep false in public repos.
    required: false
    default: "false"
  scratch_dir:
    description: Where the thread files go; gitignore it.
    required: false
    default: .issue

outputs:
  structured:
    description: The whole structured output (reply, notes, and the rest), as JSON.
    value: ${{ steps.read.outputs.structured }}
  output:
    description: The role's part of the structured output, as JSON.
    value: ${{ steps.read.outputs.output }}
  reply:
    description: The agent's reply.
    value: ${{ steps.read.outputs.reply }}
  number:
    description: The issue or PR, empty for a one-off.
    value: ${{ steps.gather.outputs.number }}
  comment_id:
    description: The comment the reply is in (empty when it went as a review).
    value: ${{ steps.review.outputs.posted != 'true' && steps.ack.outputs.comment_id || '' }}
  review_id:
    description: The review the reply is the body of, when it had line comments.
    value: ${{ steps.review.outputs.review_id }}
  head_sha:
    description: The PR head the agent read.
    value: ${{ steps.gather.outputs.head_sha }}
  session_id:
    description: The Claude session id.
    value: ${{ steps.claude.outputs.session_id }}
  conclusion:
    description: success or failure of the Claude run.
    value: ${{ steps.claude.outputs.conclusion }}

runs:
  using: composite
  steps:

  - name: Gate
    id: gate
    uses: actions/github-script@v9
    env:
      NUMBER: ${{ inputs.number || github.event.issue.number || github.event.pull_request.number }}
      OPT_IN_LABEL: ${{ inputs.opt_in_label }}
      MAX_RUNS: ${{ inputs.max_runs }}
      TRUSTED_IDS: ${{ inputs.trusted || format('{0},{1}', env.CLAUDE_OWNER_ID, env.CLAUDE_TRUSTED_BOTS) }}
      SESSION_KEY: ${{ inputs.session_key }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/gate.js`).run({ github, context, core });

  - name: Setup
    id: setup
    if: steps.gate.outputs.allowed == 'true'
    uses: actions/github-script@v9
    env:
      NUMBER: ${{ inputs.number || github.event.issue.number || github.event.pull_request.number }}
      AGENT: ${{ inputs.agent }}
      SCHEMA: ${{ inputs.schema }}
      APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
      MCP_CONFIG: ${{ inputs.mcp_config }}
      REVIEW: ${{ inputs.review }}
      THREADS: ${{ inputs.threads }}
      READY: ${{ inputs.ready }}
      MODEL: ${{ inputs.model }}
      MAX_TURNS: ${{ inputs.max_turns }}
      PERMISSION_MODE: ${{ inputs.permission_mode }}
      ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
      DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
      SESSION_KEY: ${{ inputs.session_key }}
      SCRATCH_DIR: ${{ inputs.scratch_dir }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/setup.js`).run({ github, context, core });

  - name: Gather
    id: gather
    if: steps.gate.outputs.allowed == 'true'
    uses: actions/github-script@v9
    env:
      NUMBER: ${{ inputs.number || github.event.issue.number || github.event.pull_request.number }}
      PROMPT: ${{ inputs.prompt }}
      PROMPT_WHEN: ${{ inputs.prompt_when }}
      TRUSTED_IDS: ${{ inputs.trusted || format('{0},{1}', env.CLAUDE_OWNER_ID, env.CLAUDE_TRUSTED_BOTS) }}
      TRUSTED_BOTS: ${{ inputs.trusted || env.CLAUDE_TRUSTED_BOTS }}
      SESSION_KEY: ${{ inputs.session_key }}
      SCRATCH_DIR: ${{ inputs.scratch_dir }}
      RESUMED: ${{ steps.setup.outputs.resumed }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/thread.js`).run({ github, context, core });

  # the reply's comment goes up first, as a spinner and a link to this run
  - name: Acknowledge
    id: ack
    if: steps.gather.outputs.prompt != '' && steps.gather.outputs.number != ''
    uses: actions/github-script@v9
    env:
      MODE: ack
      NUMBER: ${{ steps.gather.outputs.number }}
      PROMPT: ${{ inputs.prompt_when == 'always' && inputs.prompt || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ job.check_run_id && format('/job/{0}', job.check_run_id) || '' }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/comment.js`).run({ github, context, core });

  # One turn per run: nothing may outlive it. A subagent left running in the background
  # comes back on the next resume as a turn of its own, ahead of the real one.
  - name: Run Claude
    id: claude
    if: steps.gather.outputs.prompt != ''
    uses: anthropics/claude-code-action@v1
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    with:
      prompt: ${{ steps.gather.outputs.prompt }}
      # the job's own token, as narrow as the job's permissions: an App token here would be
      # within reach of an agent with a shell
      github_token: ${{ github.token }}
      allowed_bots: ${{ env.CLAUDE_ALLOWED_BOTS }},${{ inputs.trusted }}
      show_full_output: ${{ inputs.show_full_output }}
      path_to_claude_code_executable: ${{ env.PATH_TO_CLAUDE_CODE_EXECUTABLE }}
      path_to_bun_executable: ${{ env.PATH_TO_BUN_EXECUTABLE }}
      claude_args: |
        --append-system-prompt-file ${{ steps.setup.outputs.system_prompt_file }}
        ${{ steps.setup.outputs.args }}
        ${{ inputs.claude_args }}

  - name: Read the Reply
    id: read
    if: steps.gather.outputs.prompt != ''
    uses: actions/github-script@v9
    env:
      EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
    with:
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/reply.js`).run({ core });

  - name: Keep the Notes
    if: steps.gather.outputs.number != '' && steps.read.outputs.structured_file != ''
    uses: actions/github-script@v9
    env:
      NUMBER: ${{ steps.gather.outputs.number }}
      STRUCTURED_FILE: ${{ steps.read.outputs.structured_file }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/notes.js`).run({ github, context, core });

  - name: Answer Review Threads
    if: steps.gather.outputs.is_pr == 'true' && inputs.threads == 'true' && steps.read.outputs.structured_file != ''
    uses: actions/github-script@v9
    env:
      NUMBER: ${{ steps.gather.outputs.number }}
      STRUCTURED_FILE: ${{ steps.read.outputs.structured_file }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/threads.js`).run({ github, context, core });

  - name: Post the Review
    id: review
    if: steps.gather.outputs.is_pr == 'true' && inputs.review == 'true' && steps.read.outputs.structured_file != ''
    uses: actions/github-script@v9
    env:
      NUMBER: ${{ steps.gather.outputs.number }}
      STRUCTURED_FILE: ${{ steps.read.outputs.structured_file }}
      DIFF_FILE: ${{ github.workspace }}/${{ inputs.scratch_dir }}/diff.json
      HEAD_SHA: ${{ steps.gather.outputs.head_sha }}
      COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
      PROMPT: ${{ inputs.prompt_when == 'always' && inputs.prompt || '' }}
      REPLY: ${{ steps.read.outputs.reply }}
      HEADER: ${{ inputs.header }}
      SESSION_KEY: ${{ inputs.session_key }}
      SESSION_ID: ${{ steps.setup.outputs.session_id }}
      THROUGH: ${{ steps.gather.outputs.through }}
      THROUGH_ID: ${{ steps.gather.outputs.through_id }}
      BLOB: ${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.gather.outputs.head }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ job.check_run_id && format('/job/{0}', job.check_run_id) || '' }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/review.js`).run({ github, context, core });

  - name: Reply
    id: reply
    if: steps.gather.outputs.prompt != '' && steps.gather.outputs.number != '' && steps.review.outputs.posted != 'true'
    uses: actions/github-script@v9
    env:
      MODE: reply
      NUMBER: ${{ steps.gather.outputs.number }}
      COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
      STRUCTURED_FILE: ${{ steps.read.outputs.structured_file }}
      PROMPT: ${{ inputs.prompt_when == 'always' && inputs.prompt || '' }}
      REPLY: ${{ steps.read.outputs.reply }}
      HEADER: ${{ inputs.header }}
      SESSION_KEY: ${{ inputs.session_key }}
      SESSION_ID: ${{ steps.setup.outputs.session_id }}
      THROUGH: ${{ steps.gather.outputs.through }}
      THROUGH_ID: ${{ steps.gather.outputs.through_id }}
      BLOB: ${{ github.server_url }}/${{ github.repository }}/blob/${{ steps.gather.outputs.head }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ job.check_run_id && format('/job/{0}', job.check_run_id) || '' }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/comment.js`).run({ github, context, core });

  - name: Mark Ready
    if: steps.gather.outputs.is_pr == 'true' && inputs.ready == 'true' && steps.read.outputs.structured_file != ''
    uses: actions/github-script@v9
    env:
      MODE: ready
      NUMBER: ${{ steps.gather.outputs.number }}
      STRUCTURED_FILE: ${{ steps.read.outputs.structured_file }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/threads.js`).run({ github, context, core });

  # a failed or cancelled run never leaves the spinner up, and never advances the seen marker
  - name: Report Failure
    if: (failure() || cancelled()) && steps.ack.outputs.comment_id != '' && steps.reply.outputs.posted != 'true' && steps.review.outputs.posted != 'true'
    uses: actions/github-script@v9
    env:
      MODE: failure
      NUMBER: ${{ steps.gather.outputs.number }}
      COMMENT_ID: ${{ steps.ack.outputs.comment_id }}
      PROMPT: ${{ inputs.prompt_when == 'always' && inputs.prompt || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}${{ job.check_run_id && format('/job/{0}', job.check_run_id) || '' }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/lib/comment.js`).run({ github, context, core });
