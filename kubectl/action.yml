name: Kubectl
description: |
  Runs a kubectl command in a working directory, its stdout and stderr each kept in a file for the
  steps after it. The common flags are inputs of their own; `args` takes the rest.

inputs:
  cmd:
    description: The kubectl command (get, apply, build, plan, up, …).
    required: true
  args:
    description: The command's arguments, after it and before the flags below; split on spaces.
    required: false
    default: .
  cwd:
    description: The directory kubectl runs in, so the paths in `args` are relative to it.
    required: false
    default: .
  namespace:
    description: --namespace
    required: false
  all-namespaces:
    description: true for --all-namespaces
    required: false
  selector:
    description: --selector, a label selector (app.kubernetes.io/name=n8n)
    required: false
  output:
    description: --output (yaml, json, name, wide, jsonpath=…)
    required: false
  context:
    description: --context, the kubeconfig context
    required: false
  dry-run:
    description: --dry-run (server, client or none)
    required: false
  capture:
    description: true to give the stdout as the `stdout` output too, for a short result like a jsonpath
    required: false

outputs:
  output_file:
    description: The command's stdout, a file of its own for each run.
    value: ${{ steps.args.outputs.output_file }}
  error_file:
    description: The command's stderr, beside it.
    value: ${{ steps.args.outputs.error_file }}
  stdout:
    description: The stdout itself, when `capture` is true.
    value: ${{ steps.output.outputs.stdout }}

runs:
  using: composite
  steps:

  # The command line, one NUL-ended argument each, so a value with spaces stays whole.
  # The flags go after the args: build, plan and up read their first argument as the
  # app's directory. Each run gets its own files, so several in a job keep theirs.
  - name: Args
    id: args
    shell: bash
    env:
      CMD: ${{ inputs.cmd }}
      ARGS: ${{ inputs.args }}
      NAMESPACE: ${{ inputs.namespace }}
      ALL_NAMESPACES: ${{ inputs.all-namespaces }}
      SELECTOR: ${{ inputs.selector }}
      OUTPUT: ${{ inputs.output }}
      CONTEXT: ${{ inputs.context }}
      DRY_RUN: ${{ inputs.dry-run }}
    run: |
      read -ra CLI <<< "$CMD $ARGS"
      [ "$ALL_NAMESPACES" = true ] && CLI+=(--all-namespaces)
      CLI+=(
        ${NAMESPACE:+--namespace "$NAMESPACE"}
        ${SELECTOR:+--selector "$SELECTOR"}
        ${OUTPUT:+--output "$OUTPUT"}
        ${CONTEXT:+--context "$CONTEXT"}
        ${DRY_RUN:+--dry-run="$DRY_RUN"}
      )
      OUT="$(mktemp -p "$RUNNER_TEMP" kubectl-out-XXXXXX.txt)"
      FILE="${OUT/kubectl-out-/kubectl-args-}"
      printf '%s\0' "${CLI[@]}" > "$FILE"
      {
        echo "args_file=$FILE"
        echo "output_file=$OUT"
        echo "error_file=${OUT/kubectl-out-/kubectl-err-}"
      } >> "$GITHUB_OUTPUT"
      echo "kubectl ${CLI[*]}"

  # stderr goes apart, so a build stays YAML and a failure's error can be shown
  - name: Kubectl
    shell: bash
    working-directory: ${{ inputs.cwd }}
    env:
      ARGS_FILE: ${{ steps.args.outputs.args_file }}
      OUT: ${{ steps.args.outputs.output_file }}
      ERR: ${{ steps.args.outputs.error_file }}
      KUBECTL_APPLYSET: "true"
    run: |
      mapfile -d '' CLI < "$ARGS_FILE"
      set +e
      kubectl "${CLI[@]}" 2> "$ERR" | tee "$OUT"
      RC=${PIPESTATUS[0]}
      cat "$ERR" >&2
      exit $RC

  - name: Output
    id: output
    if: inputs.capture == 'true'
    shell: bash
    env:
      OUT: ${{ steps.args.outputs.output_file }}
    run: |
      MARK="EOF_$(cat /proc/sys/kernel/random/uuid)"
      {
        echo "stdout<<$MARK"
        cat "$OUT"
        [ -n "$(tail -c1 "$OUT")" ] && echo
        echo "$MARK"
      } >> "$GITHUB_OUTPUT"
