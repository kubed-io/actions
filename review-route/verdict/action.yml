name: Review Verdict
description: >
  The review agent's verdict as the review status on the head it reviewed, linked to the
  review: `looks good` passes, anything else fails, no verdict is an error. The other end of
  review-route, which reads these statuses back as its memory.

inputs:
  github_token:
    description: >
      The reviewer's token (github-actions[bot]'s, the built-in one), with statuses write:
      review-route reads back only the reviewer's statuses.
    required: false
    default: ${{ github.token }}
  check:
    description: The commit status's context, as review-route's.
    required: false
    default: Agent review
  number:
    description: The pull request (review-route's `number`).
    required: true
  sha:
    description: The head that was reviewed (review-route's `sha`).
    required: true
  last:
    description: review-route's `last`.
    required: false
    default: "false"
  output:
    description: The review agent's structured output (issue-agent's `output`), with `verdict`.
    required: false
    default: ""
  review_id:
    description: comment/end's `review_id`, which the status links to.
    required: false
    default: ""
  comment_id:
    description: comment/end's `comment_id`, linked when there is no review.
    required: false
    default: ""
  target:
    description: "review-route's `target`: `family` also makes the verdict's body for n8n."
    required: false
    default: default
  retry_of:
    description: >
      When this review is n8n's retry of an errored one, that errored run's id (the
      `review-error` dispatch's `run_id`); empty otherwise.
    required: false
    default: ""

outputs:
  verdict:
    description: The verdict; empty when the review did not finish.
    value: ${{ steps.verdict.outputs.verdict }}
  handback:
    description: >
      For a `family` review that finished, its `verdict` body for n8n (issue-agent/handback's
      `body`), with the output's `summary`; the last allowed review asking for changes is
      `needs a human`. For any review that ended without a verdict, a `review-error` body
      (`retry_of` the run n8n retried, or 0), which n8n retries once and then hands back.
      Empty otherwise.
    value: ${{ steps.verdict.outputs.handback }}

runs:
  using: composite
  steps:

  - name: Set the Check
    id: verdict
    uses: actions/github-script@v9
    env:
      CHECK: ${{ inputs.check }}
      NUMBER: ${{ inputs.number }}
      SHA: ${{ inputs.sha }}
      LAST: ${{ inputs.last }}
      OUTPUT: ${{ inputs.output }}
      REVIEW_ID: ${{ inputs.review_id }}
      COMMENT_ID: ${{ inputs.comment_id }}
      TARGET: ${{ inputs.target }}
      RETRY_OF: ${{ inputs.retry_of }}
    with:
      github-token: ${{ inputs.github_token }}
      script: |
        await require(`${process.env.GITHUB_ACTION_PATH}/../lib/verdict.js`).run({ github, context, core });
